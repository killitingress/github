name: Wiederverwendbarer Start der Freigabe-Vorbereitung

# Der Mandanten-Workflow meldet den ausgewählten Branchstand an das zentrale
# Repository. Dort liegt die technische Identität, mit der der Freigabe-Branch
# in den Mandanten-Repositories entsteht.
'on':
  workflow_call:
    inputs:
      source_repository:
        description: Mandanten-Repository der Release-Freigabe
        required: true
        type: string
      source_branch:
        description: Ausgewählter Lieferbranch
        required: true
        type: string
      source_sha:
        description: Freizugebender Stand des Lieferbranches
        required: true
        type: string
      release_tag:
        description: Release-Version aus dem Wartungstool
        required: true
        type: string
      target_repository:
        description: Repository mit dem zentralen Freigabe-Workflow
        required: true
        type: string
      automation_ref:
        description: Festgelegte CI/CD-Version
        required: true
        type: string
    secrets:
      dispatch_token:
        description: Token zum Starten des zentralen Workflows
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    name: Zentrale Freigabe-Vorbereitung starten
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      # GitHub lädt release-approval-prepare.yml aus main. Der gestartete
      # Workflow lädt seine Skripte anschließend aus AUTOMATION_REF.
      - name: Zentralen Freigabe-Workflow starten
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          DISPATCH_TOKEN: ${{ secrets.dispatch_token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          AUTOMATION_REF: ${{ inputs.automation_ref }}
        run: |
          # Die Dispatch-Daten werden von Python als JSON serialisiert. Damit
          # bleiben Eingaben mit Anführungszeichen oder Zeilenumbrüchen Daten.
          request_body="$(python3 -c 'import json, os; print(json.dumps({"ref": "main", "inputs": {"source_repository": os.environ["SOURCE_REPOSITORY"], "source_branch": os.environ["SOURCE_BRANCH"], "source_sha": os.environ["SOURCE_SHA"], "release_tag": os.environ["RELEASE_TAG"], "automation_ref": os.environ["AUTOMATION_REF"]}}))')"
          curl --fail --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$request_body" \
            "$GITHUB_API_URL/repos/$TARGET_REPOSITORY/actions/workflows/release-approval-prepare.yml/dispatches"
