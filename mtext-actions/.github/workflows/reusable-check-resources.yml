name: Wiederverwendbare JSON- und XML-Prüfung

# Dieser Workflow prüft die JSON- und XML-Ressourcen eines Mandanten-Commits
'on':
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      automation_ref:
        required: true
        type: string
      changed_only:
        description: Prüft nur die durch den Pull Request eingebrachten Ressourcen
        required: false
        default: false
        type: boolean
    secrets:
      automation_token:
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Prüft JSON- und XML-Ressourcen
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      # Lädt den zu prüfenden Mandanten-Commit in den Arbeitsbereich
      - name: Check-Out Mandanten-Commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          # Lädt den Commit mit seinem ersten Elternteil für die Änderungsprüfung
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      # Lädt die freigegebene Ressourcenprüfung in den Arbeitsbereich
      - name: Check-Out Ressourcenprüfung
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ inputs.automation_ref }}
          path: automation
          persist-credentials: false
          token: ${{ secrets.automation_token }}

      # Prüft den Runner und stellt den Pfad zur Python-Laufzeit als Ausgabe bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: automation/scripts/runner-preflight.sh

      # Prüft JSON-Syntax und XML-Wohlgeformtheit und gibt Befunde als Warnungen aus
      - name: Ausführung Ressourcenprüfung
        env:
          CHANGED_ONLY: ${{ inputs.changed_only && '--changed-only' || '' }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/check_resources.py
          --root source
          --formats automation/config/ressourcenformate.json
          $CHANGED_ONLY
