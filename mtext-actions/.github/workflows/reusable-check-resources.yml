name: Wiederverwendbare Konfigurations- und Ressourcenprüfung

# Dieser Workflow prüft Mandantenkonfiguration sowie JSON- und XML-Ressourcen.
'on':
  workflow_call:
    inputs:
      commit_sha:
        description: Commit im Mandanten-Repository, dessen Ressourcen geprüft werden
        required: true
        type: string
      automation_ref:
        description: CI/CD-Version, aus der dieser Workflow geladen wurde
        required: true
        type: string
      changed_only:
        description: Bei Pull Requests nur geänderte Ressourcen prüfen
        required: false
        default: false
        type: boolean
    secrets:
      automation_token:
        description: Token zum Laden der festgelegten CI/CD-Version
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Mandantenkonfiguration und Ressourcen prüfen
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      # Lädt den zu prüfenden Commit in den Arbeitsbereich
      - name: Check-Out Mandanten-Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          # Lädt auch den vorherigen Commit für den Vergleich
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      # Lädt die festgelegte Version der Prüfungen.
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ inputs.automation_ref }}
          path: automation
          persist-credentials: false
          token: ${{ secrets.automation_token }}

      # Prüft Git und Python und stellt den Python-Pfad bereit.
      - name: Python-Runtime ermitteln
        id: runtime
        run: bash automation/scripts/runner-preflight.sh

      # Prüft die Mandantenkonfiguration ohne Ressourcen zu übertragen.
      - name: Mandantenkonfiguration prüfen
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/mtext.py
          validate-config

      # Prüft JSON-Syntax und XML-Wohlgeformtheit und gibt Befunde als Warnungen aus.
      - name: Ressourcen prüfen
        env:
          CHANGED_ONLY: ${{ inputs.changed_only && '--changed-only' || '' }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/mtext.py check-resources
          --root source
          --formats automation/config/ressourcenformate.json
          $CHANGED_ONLY
