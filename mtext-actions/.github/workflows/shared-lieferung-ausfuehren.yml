name: Shared Workflow – Lieferung ausführen

# Dieser Workflow prüft die Freigabe, übernimmt die zugehörige Vorbereitung und
# führt die Lieferung im Mandanten-Repository aus. Ein vorhandener Liefer-Tag
# bezeichnet eine manuell gestartete Wiederholung und benötigt kein Issue.
'on':
  workflow_call:
    inputs:
      liefer_tag:
        description: Vorhandener Liefer-Tag für eine Wiederholung
        required: false
        default: ''
        type: string
      freigabe_issue:
        description: Issue-Nummer der freigegebenen Vorbereitung
        required: false
        default: 0
        type: number
    secrets:
      mainframe_ftps_password:
        description: Passwort des technischen Mainframe-Benutzers
        required: true

jobs:
  check:
    name: Liefer-Tag prüfen
    permissions:
      contents: read
      actions: read
      issues: write
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    outputs:
      source_sha: >-
        ${{ steps.resolve.outputs.wiederholung == 'true' &&
        steps.resolve.outputs.source_sha || steps.confirm.outputs.source_sha }}
      wiederholung: ${{ steps.resolve.outputs.wiederholung }}
      liefer_tag: >-
        ${{ steps.resolve.outputs.wiederholung == 'true' &&
        steps.resolve.outputs.liefer_tag || steps.confirm.outputs.liefer_tag }}
    steps:
      - name: mtext_actions laden
        id: automation
        uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions@main

      # Prüft die wirksame Rolle und ermittelt danach genau einen Lieferweg.
      - name: Freigabe und Lieferstand prüfen
        id: resolve
        env:
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          GITHUB_TOKEN: ${{ github.token }}
          FREIGABE_ISSUE: ${{ inputs.freigabe_issue }}
          LIEFER_TAG: ${{ inputs.liefer_tag }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$ACTION_PATH/src/mtext.py" delivery resolve
          --tag "$LIEFER_TAG" --issue "$FREIGABE_ISSUE"

      # Lädt die ermittelte Vorbereitung aus dem Laufartefakt des Mandanten-Repositories
      - name: Vorbereitung herunterladen
        if: steps.resolve.outputs.wiederholung != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTEFAKT_ID: ${{ steps.resolve.outputs.vorbereitung_artefakt_id }}
        run: |
          set -euo pipefail

          # temporären Download auch bei einem Fehler entfernen
          archive="$(mktemp "$RUNNER_TEMP/vorbereitung.XXXXXX")"
          trap 'rm -f "$archive"' EXIT

          # Artefakt aus dem Vorbereitungslauf als ZIP laden und der Download-Weiterleitung folgen
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$archive" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTEFAKT_ID/zip"

          # Vorbereitungsdatei aus dem ZIP für die anschließende Bestätigung bereitstellen
          mkdir -p vorbereitung
          unzip -p "$archive" vorbereitung.json > vorbereitung/vorbereitung.json

      # Prüft die Zuordnung der Vorbereitung zum Freigabe-Issue.
      - name: Lieferung bestätigen
        id: confirm
        if: steps.resolve.outputs.wiederholung != 'true'
        env:
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          FREIGABE_ISSUE: ${{ inputs.freigabe_issue }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$ACTION_PATH/src/mtext.py" delivery confirm
          --issue "$FREIGABE_ISSUE"

  # Erstellt die Projektpakete mit JCL und JSON-Informationsdateien.
  build:
    name: FULL- oder DELTA-Artefakt erstellen
    needs: check
    permissions:
      contents: read
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      # Lädt den in der Vorbereitung festgehaltenen Stand mit seiner Historie.
      - name: Check-Out Lieferstand
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ needs.check.outputs.source_sha }}

      - name: mtext_actions laden
        id: automation
        uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions@main

      # Schreibt die Lieferdateien nach runner.temp/dist. Das temporäre
      # Basisverzeichnis wird vom Runner je Job bereinigt.
      - name: Lieferdateien erstellen
        env:
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          LIEFER_TAG: ${{ needs.check.outputs.liefer_tag }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$ACTION_PATH/src/mtext.py" release build
          --tag "$LIEFER_TAG"

      # Speichert die erzeugten Lieferdateien als Laufartefakt.
      - name: Lieferartefakt speichern
        uses: actions/upload-artifact@v3
        with:
          name: release
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 30

  # Übergibt die Lieferdateien an den Mainframe.
  publish:
    name: Lieferung an Mainframe übergeben
    needs: build
    permissions:
      contents: read
      actions: read
    runs-on: [self-hosted, linux]
    concurrency:
      group: mainframe-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: mtext_actions laden
        id: automation
        uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions@main

      # Lädt das Lieferartefakt in das temporäre Verzeichnis dieses Jobs.
      - name: Lieferartefakt herunterladen
        uses: actions/download-artifact@v3
        with:
          name: release
          path: ${{ runner.temp }}/release

      # Überträgt jedes Archiv per FTPS und reicht seine JCL bei JES ein.
      - name: Lieferung an Mainframe übergeben
        env:
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          MAINFRAME_FTPS_PASSWORD: ${{ secrets.mainframe_ftps_password }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$ACTION_PATH/src/mtext.py" release mainframe

  # Kennzeichnet den angenommenen Stand und veröffentlicht den Bereitstellungsbericht.
  report:
    name: Lieferstand in GitHub bereitstellen
    needs: [check, publish]
    permissions:
      contents: write
      actions: read
      issues: write
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: mtext_actions laden
        id: automation
        uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions@main

      # Der Tag zeigt auf die zuvor erfolgreich an den Mainframe übergebene SHA.
      - name: Liefer-Tag erstellen
        if: needs.check.outputs.wiederholung != 'true'
        env:
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          GITHUB_TOKEN: ${{ github.token }}
          LIEFER_TAG: ${{ needs.check.outputs.liefer_tag }}
          SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$ACTION_PATH/src/mtext.py" delivery tag
          --tag "$LIEFER_TAG"

      # Lädt das Lieferartefakt in das temporäre Verzeichnis dieses Jobs.
      - name: Lieferartefakt herunterladen
        uses: actions/download-artifact@v3
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: GitHub Release veröffentlichen
        env:
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$ACTION_PATH/src/mtext.py" release github
          --tag "${{ needs.check.outputs.liefer_tag }}"

      # Das Issue protokolliert den erfolgreichen Lauf und bleibt danach lesbar geschlossen.
      - name: Freigabe abschließen
        if: inputs.freigabe_issue != 0
        env:
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          FREIGABE_ISSUE: ${{ inputs.freigabe_issue }}
          GITHUB_TOKEN: ${{ github.token }}
          LIEFER_TAG: ${{ needs.check.outputs.liefer_tag }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$ACTION_PATH/src/mtext.py" delivery complete
          --tag "$LIEFER_TAG" --issue "$FREIGABE_ISSUE"

  # Ein offenes Issue verweist auch bei einem fehlgeschlagenen Folgejob auf den Lauf.
  rueckmeldung:
    name: Nicht abgeschlossene Lieferung melden
    needs: [check, build, publish, report]
    if: ${{ always() && inputs.freigabe_issue != 0 && needs.report.result != 'success' }}
    permissions:
      issues: write
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: mtext_actions laden
        id: automation
        uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions@main

      - name: Lieferlauf im Issue melden
        env:
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          FREIGABE_ISSUE: ${{ inputs.freigabe_issue }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$ACTION_PATH/src/mtext.py" delivery incomplete
          --issue "$FREIGABE_ISSUE"
