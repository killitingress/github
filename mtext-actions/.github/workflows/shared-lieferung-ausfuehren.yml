name: Shared Workflow – Lieferung ausführen

# Dieser Workflow ermittelt den Lieferstand im Mandanten-Repository.
# Für einen geplanten Tag lädt er die neueste
# Vorbereitung und prüft sie mit der ausführenden Person. Eine Direktlieferung
# erfordert die übergebene bewusste Bestätigung. Ein vorhandener Liefer-Tag
# bezeichnet eine Wiederholung und benötigt keine neue Vorbereitung. Danach
# führt er die Lieferung mit SHA und Branch im selben Mandantenlauf aus.
'on':
  workflow_call:
    inputs:
      liefer_tag:
        description: Geplanter oder vorhandener Liefer-Tag
        required: true
        type: string
      direktlieferung_bestaetigt:
        description: Bewusste Bestätigung einer Direktlieferung
        required: true
        type: boolean
    secrets:
      mainframe_ftps_password:
        description: Passwort des technischen Mainframe-Benutzers
        required: true

jobs:
  check:
    name: Liefer-Tag prüfen
    permissions:
      contents: read
      actions: read
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    outputs:
      source_sha: >-
        ${{ steps.resolve.outputs.wiederholung == 'true' &&
        steps.resolve.outputs.source_sha || steps.confirm.outputs.source_sha }}
      wiederholung: ${{ steps.resolve.outputs.wiederholung }}
    steps:
      # Lädt die gemeinsame Lieferlogik und prüft die Python-Runtime des Runners.
      - name: M/Text-Automatisierung laden
        id: automation
        uses: FI-Actions/fi_lbs_entw_oms_mtext_actions@main

      - name: Lieferstand ermitteln
        id: resolve
        env:
          AUTOMATION_PATH: ${{ steps.automation.outputs.automation_path }}
          GITHUB_TOKEN: ${{ github.token }}
          LIEFER_TAG: ${{ inputs.liefer_tag }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$AUTOMATION_PATH/src/mtext.py" delivery resolve
          --tag "$LIEFER_TAG"

      # Lädt die ermittelte Vorbereitung aus dem Laufartefakt des
      # Mandanten-Repositories
      - name: Vorbereitung laden
        if: steps.resolve.outputs.wiederholung != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTEFAKT_ID: ${{ steps.resolve.outputs.vorbereitung_artefakt_id }}
        run: |
          set -euo pipefail

          # temporären Download auch bei einem Fehler entfernen
          archive="$(mktemp "$RUNNER_TEMP/vorbereitung.XXXXXX")"
          trap 'rm -f "$archive"' EXIT

          # Artefakt aus dem Vorbereitungslauf als ZIP laden und der Download-Weiterleitung folgen
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$archive" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTEFAKT_ID/zip"

          # Vorbereitungsdatei aus dem ZIP für die anschließende Bestätigung bereitstellen
          mkdir -p vorbereitung
          unzip -p "$archive" vorbereitung.json > vorbereitung/vorbereitung.json

      # Prüft die Vorbereitung und den Lieferweg der ausführenden Person
      - name: Lieferung bestätigen
        id: confirm
        if: steps.resolve.outputs.wiederholung != 'true'
        env:
          AUTOMATION_PATH: ${{ steps.automation.outputs.automation_path }}
          LIEFER_TAG: ${{ inputs.liefer_tag }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$AUTOMATION_PATH/src/mtext.py" delivery confirm
          --tag "$LIEFER_TAG"
          ${{ inputs.direktlieferung_bestaetigt && '--confirm-direct-delivery' || '' }}

  # Läuft auch bei Wiederholung durch, damit build, publish und report
  # nicht wegen eines übersprungenen Vorgängers ausfallen.
  tag:
    name: Liefer-Tag erstellen
    needs: check
    permissions:
      contents: write
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Vorhandenen Liefer-Tag übernehmen
        if: needs.check.outputs.wiederholung == 'true'
        run: echo "Liefer-Tag ${{ inputs.liefer_tag }} ist vorhanden."

      # Lädt den in der Vorbereitung festgehaltenen Stand mit seiner Historie.
      - name: Check-Out Mandantenstand
        if: needs.check.outputs.wiederholung != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ needs.check.outputs.source_sha }}

      # Lädt die gemeinsame Lieferlogik und prüft die Python-Runtime des Runners.
      - name: M/Text-Automatisierung laden
        if: needs.check.outputs.wiederholung != 'true'
        id: automation
        uses: FI-Actions/fi_lbs_entw_oms_mtext_actions@main

      # Der Tag zeigt auf die in der bestätigten Vorbereitung festgehaltene SHA.
      - name: Liefer-Tag erstellen
        if: needs.check.outputs.wiederholung != 'true'
        env:
          AUTOMATION_PATH: ${{ steps.automation.outputs.automation_path }}
          GITHUB_TOKEN: ${{ github.token }}
          LIEFER_TAG: ${{ inputs.liefer_tag }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$AUTOMATION_PATH/src/mtext.py" delivery tag
          --tag "$LIEFER_TAG"

  # Erstellt die Projektpakete mit JCL und JSON-Informationsdateien.
  build:
    name: FULL- oder DELTA-Artefakt erstellen
    needs: [check, tag]
    permissions:
      contents: read
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      # Lädt den Commit des Liefer-Tags mit seiner Historie.
      - name: Check-Out Liefer-Tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: refs/tags/${{ inputs.liefer_tag }}

      # Lädt die gemeinsame Lieferlogik und prüft die Python-Runtime des Runners.
      - name: M/Text-Automatisierung laden
        id: automation
        uses: FI-Actions/fi_lbs_entw_oms_mtext_actions@main

      # Schreibt die Lieferdateien nach runner.temp/dist. Das temporäre
      # Basisverzeichnis wird vom Runner je Job bereinigt.
      - name: Lieferdateien erstellen
        env:
          AUTOMATION_PATH: ${{ steps.automation.outputs.automation_path }}
          LIEFER_TAG: ${{ inputs.liefer_tag }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$AUTOMATION_PATH/src/mtext.py" release build
          --tag "$LIEFER_TAG"

      # Speichert die erzeugten Lieferdateien als Laufartefakt.
      - name: Lieferartefakt speichern
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: release
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Die Mainframe-Zugangsdaten sind in diesem Job verfügbar.
  publish:
    name: Lieferung an Mainframe übergeben
    needs: build
    permissions:
      contents: read
      actions: read
    runs-on: [self-hosted, linux]
    concurrency:
      group: mainframe-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      # Lädt die gemeinsame Lieferlogik und prüft die Python-Runtime des Runners.
      - name: M/Text-Automatisierung laden
        id: automation
        uses: FI-Actions/fi_lbs_entw_oms_mtext_actions@main

      # Lädt das Lieferartefakt in das temporäre Verzeichnis dieses Jobs.
      - name: Lieferartefakt herunterladen
        uses: actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: release
          path: ${{ runner.temp }}/release

      # Überträgt jedes Archiv per FTPS und reicht seine JCL bei JES ein.
      - name: Lieferung an Mainframe übergeben
        env:
          AUTOMATION_PATH: ${{ steps.automation.outputs.automation_path }}
          MAINFRAME_FTPS_PASSWORD: ${{ secrets.mainframe_ftps_password }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$AUTOMATION_PATH/src/mtext.py" release mainframe

  # Veröffentlicht den Bereitstellungsbericht nach der Mainframe-Übergabe.
  report:
    name: Bereitstellungsbericht im Mandanten-Repository veröffentlichen
    needs: publish
    permissions:
      contents: write
      actions: read
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      # Lädt die gemeinsame Lieferlogik und prüft die Python-Runtime des Runners.
      - name: M/Text-Automatisierung laden
        id: automation
        uses: FI-Actions/fi_lbs_entw_oms_mtext_actions@main

      # Lädt das Lieferartefakt in das temporäre Verzeichnis dieses Jobs.
      - name: Lieferartefakt herunterladen
        uses: actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: GitHub Release veröffentlichen
        env:
          AUTOMATION_PATH: ${{ steps.automation.outputs.automation_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$AUTOMATION_PATH/src/mtext.py" release github
          --tag "${{ inputs.liefer_tag }}"
