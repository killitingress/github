name: Lieferung ausführen

# Dieser Workflow prüft die Freigabe, übernimmt den Lieferstand aus dem Issue und
# führt die Lieferung im Mandanten-Repository aus. Freigabe und Wiederholung
# werden ausschließlich über das Freigabe-Issue angestoßen.
'on':
  workflow_call:
    inputs:
      freigabe_issue:
        description: Issue-Nummer der freigegebenen Vorbereitung
        required: true
        type: number
    secrets:
      ize9_ftps_password_mtext:
        description: Passwort des technischen Mainframe-Benutzers
        required: true

jobs:
  check:
    name: Freigabe prüfen
    permissions:
      contents: read
      issues: write
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      wiederholung: ${{ steps.resolve.outputs.wiederholung }}
      liefer_tag: ${{ steps.resolve.outputs.liefer_tag }}
    steps:
      - name: mtext_actions laden
        id: automation
        uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions@main

      # Prüft Rolle und Issue und bestätigt eine neue Freigabe direkt.
      - name: Freigabe und Lieferstand prüfen
        id: resolve
        env:
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          GITHUB_TOKEN: ${{ github.token }}
          FREIGABE_ISSUE: ${{ inputs.freigabe_issue }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$ACTION_PATH/src/mtext.py" delivery resolve
          --issue "$FREIGABE_ISSUE"

  # Erstellt die Projektarchive mit ihrer JCL.
  build:
    name: Lieferartefakt erstellen
    needs: check
    permissions:
      contents: read
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    outputs:
      dry_run: ${{ steps.package.outputs.dry_run }}
    steps:
      # Lädt den in der Vorbereitung festgehaltenen Stand mit seiner Historie.
      - name: Check-Out Lieferstand
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ needs.check.outputs.source_sha }}

      - name: mtext_actions laden
        id: automation
        uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions@main

      # Schreibt die Lieferdateien nach runner.temp/dist. Das temporäre
      # Basisverzeichnis wird vom Runner je Job bereinigt.
      - name: Lieferdateien erstellen
        id: package
        env:
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          LIEFER_TAG: ${{ needs.check.outputs.liefer_tag }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$ACTION_PATH/src/mtext.py" release build
          --tag "$LIEFER_TAG"

      # Speichert die erzeugten Lieferdateien als Laufartefakt.
      - name: Lieferartefakt speichern
        uses: actions/upload-artifact@v3
        with:
          name: release
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 30

  # Prüft die Lieferdateien und übergibt sie außerhalb eines Dry Runs an den Mainframe.
  publish:
    name: An Mainframe übergeben
    needs: build
    permissions:
      contents: read
      actions: read
    runs-on: [self-hosted, linux]
    outputs:
      dry_run: ${{ needs.build.outputs.dry_run }}
    concurrency:
      group: mainframe-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: mtext_actions laden
        id: automation
        uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions@main

      # Lädt das Lieferartefakt in das temporäre Verzeichnis dieses Jobs.
      - name: Lieferartefakt herunterladen
        uses: actions/download-artifact@v3
        with:
          name: release
          path: ${{ runner.temp }}/release

      # Überträgt außerhalb eines Dry Runs jedes Archiv und reicht seine JCL bei JES ein.
      - name: Lieferung an Mainframe übergeben
        env:
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          DRY_RUN: ${{ needs.build.outputs.dry_run }}
          IZE9_FTPS_PASSWORD_MTEXT: ${{ secrets.ize9_ftps_password_mtext }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$ACTION_PATH/src/mtext.py" release mainframe

  # Kennzeichnet den verarbeiteten Stand und schließt das Freigabe-Issue ab.
  report:
    name: Abschließen
    needs: [check, publish]
    permissions:
      contents: write
      actions: read
      issues: write
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: mtext_actions laden
        id: automation
        uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions@main

      # Der Tag zeigt auf die verarbeitete SHA, im Dry Run ohne Mainframe-Übergabe.
      - name: Liefer-Tag erstellen
        if: needs.check.outputs.wiederholung != 'true'
        env:
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          GITHUB_TOKEN: ${{ github.token }}
          LIEFER_TAG: ${{ needs.check.outputs.liefer_tag }}
          SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
          FREIGABE_ISSUE: ${{ inputs.freigabe_issue }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$ACTION_PATH/src/mtext.py" delivery tag
          --tag "$LIEFER_TAG" --issue "$FREIGABE_ISSUE"

      # Lädt das Lieferartefakt in das temporäre Verzeichnis dieses Jobs.
      - name: Lieferartefakt herunterladen
        uses: actions/download-artifact@v3
        with:
          name: release
          path: ${{ runner.temp }}/release

      # Das Issue protokolliert Dateinamen und Prüfsummen und bleibt danach lesbar geschlossen.
      - name: Freigabe abschließen
        env:
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          FREIGABE_ISSUE: ${{ inputs.freigabe_issue }}
          DRY_RUN: ${{ needs.publish.outputs.dry_run }}
          GITHUB_TOKEN: ${{ github.token }}
          LIEFER_TAG: ${{ needs.check.outputs.liefer_tag }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$ACTION_PATH/src/mtext.py" delivery complete
          --tag "$LIEFER_TAG" --issue "$FREIGABE_ISSUE"

  # Das Freigabe-Issue verweist auch bei einem fehlgeschlagenen Folgejob auf den Lauf.
  rueckmeldung:
    name: Abbruch melden
    needs: [check, publish, report]
    if: ${{ always() && needs.report.result != 'success' }}
    permissions:
      issues: write
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: mtext_actions laden
        id: automation
        uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions@main

      - name: Lieferlauf im Issue melden
        env:
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          FREIGABE_ISSUE: ${{ inputs.freigabe_issue }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$ACTION_PATH/src/mtext.py" delivery incomplete
          --issue "$FREIGABE_ISSUE"
