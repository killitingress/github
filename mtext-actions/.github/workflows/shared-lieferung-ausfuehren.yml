name: Shared Workflow – Lieferung ausführen

# Dieser Workflow löst einen geplanten oder vorhandenen Liefer-Tag im
# Mandanten-Repository auf. Für einen geplanten Tag lädt er die neueste
# Vorbereitung und prüft sie mit der ausführenden Person. Eine Direktlieferung
# erfordert die übergebene bewusste Bestätigung. Ein vorhandener Liefer-Tag
# bezeichnet eine Wiederholung und benötigt keine neue Vorbereitung. Danach
# startet er nach bestätigtem Lieferweg die zentrale Lieferung mit SHA und Branch.
'on':
  workflow_call:
    inputs:
      liefer_tag:
        description: Geplanter oder vorhandener Liefer-Tag
        required: true
        type: string
      direktlieferung_bestaetigt:
        description: Bewusste Bestätigung einer Direktlieferung
        required: true
        type: boolean
    secrets:
      automation_token:
        description: Token zum Laden der zentralen CI/CD-Implementierung
        required: true
      dispatch_token:
        description: Token zum Starten der zentralen Lieferung
        required: true

permissions:
  contents: read
  actions: read

jobs:
  pruefen:
    name: Liefer-Tag prüfen
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    outputs:
      source_sha: >-
        ${{ steps.aufloesen.outputs.wiederholung == 'true' &&
        steps.aufloesen.outputs.source_sha || steps.bestaetigen.outputs.source_sha }}
      source_branch: ${{ steps.bestaetigen.outputs.source_branch }}
      wiederholung: ${{ steps.aufloesen.outputs.wiederholung }}
    steps:
      # Lädt die freigegebene Implementierung der Lieferausführung.
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: main
          path: automation
          persist-credentials: false
          token: ${{ secrets.automation_token }}

      # Prüft Git und Python und stellt den Python-Pfad bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: bash automation/scripts/runner-preflight.sh

      - name: Liefer-Tag auflösen
        id: aufloesen
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          LIEFER_TAG: ${{ inputs.liefer_tag }}
        run: >-
          "${{ steps.runtime.outputs.python }}"
          automation/src/mtext.py lieferung aufloesen
          --tag "$LIEFER_TAG"
          --api-url "$GITHUB_API_URL"

      # Lädt die ermittelte Vorbereitung aus dem Laufartefakt des
      # Mandanten-Repositories
      - name: Vorbereitung laden
        if: steps.aufloesen.outputs.wiederholung != 'true'
        uses: actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: ${{ steps.aufloesen.outputs.vorbereitung_name }}
          path: vorbereitung
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.aufloesen.outputs.vorbereitung_id }}

      # Prüft die Vorbereitung und den Lieferweg der ausführenden Person
      - name: Lieferung bestätigen
        id: bestaetigen
        if: steps.aufloesen.outputs.wiederholung != 'true'
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          LIEFER_TAG: ${{ inputs.liefer_tag }}
        run: >-
          "${{ steps.runtime.outputs.python }}"
          automation/src/mtext.py lieferung ausfuehren
          --tag "$LIEFER_TAG"
          --vorbereitung vorbereitung/vorbereitung.json
          --actor "$ACTOR"
          ${{ inputs.direktlieferung_bestaetigt && '--direktlieferung-bestaetigt' || '' }}

  # Nach der Prüfung startet der zentrale Lieferworkflow. Dieser
  # entscheidet anhand der Wiederholung, ob zuvor ein Liefer-Tag entsteht.
  ausfuehren:
    name: Zentrale Lieferung starten
    needs: pruefen
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      # Der API-Aufruf erzeugt einen eigenen Lauf in mtext_actions. Dort stehen
      # die technische Identität und die Zugänge für die Lieferung bereit.
      - name: Zentrale Lieferung starten
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          DISPATCH_TOKEN: ${{ secrets.dispatch_token }}
          # toJSON kodiert die übergebenen Werte für den API-Aufruf.
          REQUEST_BODY: >-
            {"ref":"main","inputs":{"source_repository":${{ toJSON(github.repository) }},"liefer_tag":${{ toJSON(inputs.liefer_tag) }},"source_sha":${{ toJSON(needs.pruefen.outputs.source_sha) }},"source_branch":${{ toJSON(needs.pruefen.outputs.source_branch) }},"wiederholung":${{ toJSON(needs.pruefen.outputs.wiederholung == 'true') }}}}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$REQUEST_BODY" \
            "$GITHUB_API_URL/repos/FinanzInformatik/fi_lbs_entw_oms_mtext_actions/actions/workflows/lieferung.yml/dispatches"
