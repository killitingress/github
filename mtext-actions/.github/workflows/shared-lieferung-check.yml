name: Shared Workflow – Lieferung vorprüfen

# Dieser Workflow bereitet den ausgewählten Branchstand für eine spätere
# Lieferung vor. Er lädt die festzuhaltende SHA mit ihrer Historie und prüft den
# vorgesehenen Liefer-Tag, den Branch und den Lieferumfang. Das Ergebnis wird in
# der Actions-Zusammenfassung angezeigt. Die geprüften Angaben werden als
# Vorbereitung für 30 Tage im aufrufenden Mandantenlauf gespeichert. In diesem
# Lauf entstehen weder ein Liefer-Tag noch eine Mainframe-Übergabe.
'on':
  workflow_call:
    inputs:
      liefer_tag:
        description: Vorgesehener Liefer-Tag
        required: true
        type: string
permissions:
  contents: read

jobs:
  check:
    name: Lieferung vorprüfen
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Check-Out Mandantenstand
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false

      # Lädt die gemeinsame Lieferlogik und prüft die Python-Runtime des Runners.
      - name: M/Text-Automatisierung laden
        id: automation
        uses: FI-Actions/fi_lbs_entw_oms_mtext_actions@main

      # Prüft Liefer-Tag, Branch und Lieferumfang, schreibt die Vorprüfung in die
      # Actions-Zusammenfassung und legt vorbereitung.json an
      - name: Lieferung und Lieferumfang prüfen
        id: check
        env:
          AUTOMATION_PATH: ${{ steps.automation.outputs.automation_path }}
          LIEFER_TAG: ${{ inputs.liefer_tag }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$AUTOMATION_PATH/src/mtext.py" delivery check
          --tag "$LIEFER_TAG"

      - name: Vorbereitung festhalten
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: ${{ steps.check.outputs.vorbereitung_name }}
          path: ${{ steps.check.outputs.vorbereitung_path }}
          if-no-files-found: error
          retention-days: 30
