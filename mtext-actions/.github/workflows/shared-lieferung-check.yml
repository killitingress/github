name: Lieferprüfung

# Dieser Workflow bereitet den ausgewählten Branchstand für eine spätere
# Lieferung vor. Er lädt die festzuhaltende SHA mit ihrer Historie und prüft den
# aus dem Branch abgeleiteten Liefer-Tag und den Lieferumfang. Das Ergebnis steht
# im Freigabe-Issue, auf das die Actions-Zusammenfassung verweist. In diesem
# Lauf entstehen weder Liefer-Tag noch Übergabe.
'on':
  workflow_call:
permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Freigabe-Issue erstellen
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Check-Out Mandantenstand
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: mtext_actions laden
        id: automation
        uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions@main

      # Leitet den Liefer-Tag ab, prüft den Lieferumfang und legt das Issue an.
      - name: Lieferung und Lieferumfang prüfen
        env:
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$ACTION_PATH/src/mtext.py" delivery check
