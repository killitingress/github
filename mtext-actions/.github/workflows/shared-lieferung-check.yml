name: Shared Workflow – Lieferung vorprüfen

# Dieser Workflow bereitet den ausgewählten Branchstand für eine spätere
# Lieferung vor. Er lädt die festzuhaltende SHA mit ihrer Historie und prüft den
# vorgesehenen Liefer-Tag, den Branch und den Lieferumfang. Das Ergebnis wird in
# der Actions-Zusammenfassung angezeigt. Die geprüften Angaben werden als
# Vorbereitung für 30 Tage im aufrufenden Mandantenlauf gespeichert. In diesem
# Lauf entstehen weder ein Liefer-Tag noch eine Mainframe-Übergabe.
'on':
  workflow_call:
    inputs:
      source_repository:
        description: Mandanten-Repository, dessen Stand vorbereitet wird
        required: true
        type: string
      source_branch:
        description: Ausgewählter Branch der Vorbereitung
        required: true
        type: string
      source_sha:
        description: Festzuhaltender Branchstand
        required: true
        type: string
      lieferung_tag:
        description: Vorgesehener Liefer-Tag
        required: true
        type: string
      actor:
        description: Vorbereitende Person
        required: true
        type: string
    secrets:
      automation_token:
        description: Token zum Laden der zentralen CI/CD-Implementierung
        required: true
permissions:
  contents: read

jobs:
  # Prüft den vorgesehenen Lieferstand und hält seine Angaben für die spätere
  # Ausführung fest
  check:
    name: Lieferung vorprüfen
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      # Lädt den festzuhaltenden Stand mit seiner Historie für FULL- und
      # DELTA-Vergleich.
      - name: Check-Out Mandantenstand
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha }}

      # Lädt die freigegebene Implementierung der Vorprüfung.
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: main
          path: automation
          persist-credentials: false
          token: ${{ secrets.automation_token }}

      # Prüft Git und Python und stellt den Python-Pfad bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: bash automation/scripts/runner-preflight.sh

      # Das Kommando prüft die technische Erstellbarkeit, schreibt den
      # geplanten Lieferumfang nach GITHUB_STEP_SUMMARY und legt die
      # festgehaltenen Angaben für die spätere Bestätigung ab.
      - name: Lieferung und Lieferumfang prüfen
        id: check
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          LIEFERUNG_TAG: ${{ inputs.lieferung_tag }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ACTOR: ${{ inputs.actor }}
        run: >-
          "${{ steps.runtime.outputs.python }}"
          automation/src/mtext.py lieferung check
          --tag "$LIEFERUNG_TAG"
          --branch "$SOURCE_BRANCH"
          --source-sha "$SOURCE_SHA"
          --actor "$ACTOR"

      # Speichert die geprüften Angaben als Artefakt des Mandantenlaufs
      - name: Vorbereitung festhalten
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: ${{ steps.check.outputs.vorbereitung_name }}
          path: ${{ steps.check.outputs.vorbereitung_path }}
          if-no-files-found: error
          retention-days: 30
