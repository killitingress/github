name: Shared Workflow – Zentralen Workflow starten

# Zentrale Abläufe wechseln in das zentrale Repository. Dort liegen die
# technische Identität und die Zugangsdaten für ihre weiteren Schritte.
'on':
  workflow_call:
    inputs:
      workflow:
        description: Datei des zentral zu startenden Workflows
        required: true
        type: string
      workflow_inputs:
        description: JSON-Objekt mit den Eingaben des zentralen Workflows
        required: true
        type: string
    secrets:
      dispatch_token:
        description: Token zum Starten des zentralen Workflows
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    name: Zentralen Workflow starten
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      # Der API-Aufruf erzeugt einen Lauf in mtext_actions, damit dort die
      # zentrale technische Identität und die zentralen Secrets gelten.
      - name: Zentralen Workflow starten
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          DISPATCH_TOKEN: ${{ secrets.dispatch_token }}
          WORKFLOW: ${{ inputs.workflow }}
          WORKFLOW_INPUTS: ${{ inputs.workflow_inputs }}
        run: |
          request_body="$(python3 -c 'import json, os; print(json.dumps({"ref": "main", "inputs": json.loads(os.environ["WORKFLOW_INPUTS"])}))')"
          curl --fail --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$request_body" \
            "$GITHUB_API_URL/repos/FinanzInformatik/fi_lbs_entw_oms_mtext_actions/actions/workflows/$WORKFLOW/dispatches"
