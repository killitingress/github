name: Wiederverwendbare Liefer-Bestätigung

# Lädt die festgehaltene Vorbereitung des genannten Mandantenlaufs. Dieselbe
# Person bestätigt eine Direktlieferung, eine andere Person erfüllt vier Augen.
'on':
  workflow_call:
    inputs:
      source_repository:
        description: Mandanten-Repository
        required: true
        type: string
      vorbereitung_id:
        description: Vorbereitungs-ID aus der Liefer-Vorprüfung
        required: true
        type: string
      actor:
        description: ausführende Person
        required: true
        type: string
      automation_ref:
        description: Festgelegte CI/CD-Version
        required: true
        type: string
    secrets:
      automation_token:
        description: Token zum Laden der festgelegten CI/CD-Version
        required: true
    outputs:
      lieferung_tag:
        description: festgehaltener Liefer-Tag
        value: ${{ jobs.pruefen.outputs.lieferung_tag }}
      source_sha:
        description: festgehaltene SHA
        value: ${{ jobs.pruefen.outputs.source_sha }}
      source_branch:
        description: festgehaltener Branch
        value: ${{ jobs.pruefen.outputs.source_branch }}
      prepare_actor:
        description: vorbereitende Person
        value: ${{ jobs.pruefen.outputs.prepare_actor }}

permissions:
  contents: read
  actions: read

jobs:
  pruefen:
    name: Vorbereitung prüfen
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    outputs:
      lieferung_tag: ${{ steps.bestaetigen.outputs.lieferung_tag }}
      source_sha: ${{ steps.bestaetigen.outputs.source_sha }}
      source_branch: ${{ steps.bestaetigen.outputs.source_branch }}
      prepare_actor: ${{ steps.bestaetigen.outputs.prepare_actor }}
    steps:
      # Lädt die festgelegte Implementierung der Lieferbestätigung.
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ inputs.automation_ref }}
          path: automation
          persist-credentials: false
          token: ${{ secrets.automation_token }}

      - name: Python-Runtime ermitteln
        id: runtime
        run: bash automation/scripts/runner-preflight.sh

      # Die offizielle Action lädt das Artefakt aus dem Vorbereitungslauf. Sie
      # übernimmt dabei auch den geschützten Wechsel zum Artefaktspeicher.
      - name: Vorbereitung laden
        uses: actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: lieferung-vorbereitung
          path: vorbereitung
          github-token: ${{ github.token }}
          repository: ${{ inputs.source_repository }}
          run-id: ${{ inputs.vorbereitung_id }}

      # Die vorbereitende und die ausführende Person bestimmen den Lieferweg.
      - name: Lieferung bestätigen
        id: bestaetigen
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          ACTOR: ${{ inputs.actor }}
        run: >-
          "${{ steps.runtime.outputs.python }}"
          automation/src/mtext.py lieferung ausfuehren
          --vorbereitung vorbereitung/vorbereitung.json
          --actor "$ACTOR"
