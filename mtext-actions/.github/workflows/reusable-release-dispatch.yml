name: Wiederverwendbarer Start des zentralen Releases

# Ein Release-Tag entsteht im Mandanten-Repository. Paketbau und Mainframe-
# Übergabe laufen im zentralen Repository, weil dort die Mainframe-Zugangsdaten
# liegen.
# Dieser Workflow startet dort release.yml und übergibt den Tag, den zugehörigen
# Commit und die angegebene CI/CD-Version.
'on':
  workflow_call:
    inputs:
      source_repository:
        description: Mandanten-Repository mit dem Release-Tag
        required: true
        type: string
      target_repository:
        description: Repository mit dem zu startenden Workflow release.yml
        required: true
        type: string
      release_tag:
        description: Release-Tag im Mandanten-Repository
        required: true
        type: string
      trigger_sha:
        description: Commit, auf den der Release-Tag zeigt
        required: true
        type: string
      automation_ref:
        description: CI/CD-Version, aus der dieser Workflow geladen wurde
        required: true
        type: string
    secrets:
      dispatch_token:
        description: Token zum Starten des zentralen Release-Workflows
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    name: Zentrales Release starten
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      # GitHub startet den Workflow im zentralen Repository über die API
      - name: Zentralen Release-Workflow starten
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          DISPATCH_TOKEN: ${{ secrets.dispatch_token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TRIGGER_SHA: ${{ inputs.trigger_sha }}
          AUTOMATION_REF: ${{ inputs.automation_ref }}
        # GitHub lädt release.yml aus main. Der gestartete Workflow lädt seine
        # Skripte anschließend aus AUTOMATION_REF.
        run: |
          # Die Dispatch-Daten werden von Python als JSON serialisiert. Damit
          # bleiben Eingaben mit Anführungszeichen oder Zeilenumbrüchen Daten.
          export SOURCE_REPOSITORY TARGET_REPOSITORY RELEASE_TAG TRIGGER_SHA AUTOMATION_REF
          request_body="$(python3 -c 'import json, os; print(json.dumps({"ref": "main", "inputs": {"source_repository": os.environ["SOURCE_REPOSITORY"], "release_tag": os.environ["RELEASE_TAG"], "trigger_sha": os.environ["TRIGGER_SHA"], "automation_ref": os.environ["AUTOMATION_REF"]}}))')"
          curl --fail --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$request_body" \
            "$GITHUB_API_URL/repos/$TARGET_REPOSITORY/actions/workflows/release.yml/dispatches"
