name: Reusable central release dispatch

# Dieser kleine Mandantenaufruf startet den zentralen CI/CD-Releaseweg in
# mtext_actions. Er erhält keinen Mainframe-Zugang.
'on':
  workflow_call:
    inputs:
      source_repository:
        required: true
        type: string
      target_repository:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      trigger_sha:
        required: true
        type: string
      automation_ref:
        required: true
        type: string
    secrets:
      dispatch_token:
        required: true

permissions:
  contents: read

jobs:
  # Der Job ruft die GitHub-API mit dem auf mtext_actions begrenzten
  # Dispatch-Token auf. Die zentrale Releaseverarbeitung prüft Repository,
  # Tag, Commit und CI/CD-Version vor dem Paketbau.
  dispatch:
    name: Start release in mtext_actions
    runs-on: FI_RUNNER_LABEL_TO_BE_SET
    timeout-minutes: 10
    steps:
      - name: Dispatch release request
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          MTEXT_ACTIONS_TOKEN: ${{ secrets.dispatch_token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TRIGGER_SHA: ${{ inputs.trigger_sha }}
          AUTOMATION_REF: ${{ inputs.automation_ref }}
        run: |
          payload="$(printf '{"ref":"main","inputs":{"source_repository":"%s","release_tag":"%s","trigger_sha":"%s","automation_ref":"%s"}}' \
            "$SOURCE_REPOSITORY" "$RELEASE_TAG" "$TRIGGER_SHA" "$AUTOMATION_REF")"
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/mtext-release-dispatch-response" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $MTEXT_ACTIONS_TOKEN" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "$GITHUB_API_URL/repos/$TARGET_REPOSITORY/actions/workflows/release.yml/dispatches")"
          if [[ "$status" != "204" ]]; then
            echo "Release-Dispatch an mtext_actions ist mit HTTP $status fehlgeschlagen" >&2
            exit 1
          fi
