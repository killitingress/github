name: Shared Workflow – Mandantenkonfiguration und Ressourcen prüfen

# Dieser Workflow prüft einen festgelegten Commit aus dem Mandanten-Repository.
# Die Mandantenkonfiguration wird in jedem Lauf gegen die zentralen Zuordnungen
# geprüft. Die Prüfung der JSON- und XML-Ressourcen kann abgewählt oder auf die
# geänderten Dateien begrenzt werden. Für den Änderungsvergleich lädt der Lauf
# zusätzlich den vorherigen Commit. Die Prüfung greift nicht auf M/Text oder den
# Mainframe zu.
'on':
  workflow_call:
    inputs:
      commit_sha:
        description: Commit im Mandanten-Repository, dessen Stand geprüft wird
        required: true
        type: string
      check_resources:
        description: JSON- und XML-Ressourcen des Mandantenstands prüfen
        required: false
        default: true
        type: boolean
      changed_only:
        description: Prüfung auf geänderte Ressourcen begrenzen
        required: false
        default: false
        type: boolean
    secrets:
      automation_token:
        description: Token zum Laden der zentralen CI/CD-Implementierung
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Mandantenkonfiguration und Ressourcen prüfen
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      # Lädt den zu prüfenden Mandantenstand. Für den Änderungsvergleich wird
      # zusätzlich sein Vorgänger benötigt.
      - name: Check-Out Mandantenstand
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          fetch-depth: ${{ inputs.check_resources && inputs.changed_only && 2 || 1 }}
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      # Lädt die freigegebene Implementierung der Prüfung
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: main
          path: automation
          persist-credentials: false
          token: ${{ secrets.automation_token }}

      # Prüft Git und Python und stellt den Python-Pfad bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: bash automation/scripts/runner-preflight.sh

      # Prüft die zentrale Zuordnung und die Konfiguration des Mandanten
      - name: Mandantenkonfiguration prüfen
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/mtext.py
          validate-config

      # Pull Requests prüfen den Diff, manuelle Vollprüfungen den gesamten Stand.
      - name: Ressourcen prüfen
        if: inputs.check_resources
        env:
          CHANGED_ONLY: ${{ inputs.changed_only && '--changed-only' || '' }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/mtext.py check-resources
          --root source
          --formats automation/config/ressourcenformate.json
          $CHANGED_ONLY
