name: Shared Workflow – Mandantenkonfiguration und Ressourcen prüfen

# Dieser Workflow prüft den Mandantenstand des aufrufenden Laufs. Die
# Mandantenkonfiguration wird in jedem Lauf gegen die zentralen Zuordnungen
# geprüft. Die Prüfung der JSON- und XML-Ressourcen kann abgewählt werden.
# Pull Requests prüfen geänderte Dateien und laden dafür den Vorgänger.
# Manuelle Läufe prüfen den gesamten Stand. Die Prüfung greift nicht auf M/Text
# oder den Mainframe zu.
'on':
  workflow_call:
    inputs:
      check_resources:
        description: JSON- und XML-Ressourcen des Mandantenstands prüfen
        required: false
        default: true
        type: boolean
    secrets:
      automation_token:
        description: Token zum Laden der zentralen CI/CD-Implementierung
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Mandantenkonfiguration und Ressourcen prüfen
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      # Für Pull Requests wird der Vorgänger für den Änderungsvergleich geladen.
      - name: Check-Out Mandantenstand
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          fetch-depth: ${{ inputs.check_resources && github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false

      # Lädt die freigegebene Implementierung der Prüfung
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: main
          path: automation
          persist-credentials: false
          token: ${{ secrets.automation_token }}

      # Prüft Git und Python und stellt den Python-Pfad bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: bash automation/scripts/runner-preflight.sh

      # Prüft die zentrale Zuordnung und die Konfiguration des Mandanten
      - name: Mandantenkonfiguration prüfen
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/mtext.py
          validate-config

      # Pull Requests prüfen geänderte Ressourcen, manuelle Läufe den gesamten Stand
      - name: Ressourcen prüfen
        if: inputs.check_resources
        env:
          CHANGED_ONLY: ${{ github.event_name == 'pull_request' && '--changed-only' || '' }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/mtext.py check-resources
          --root source
          --formats automation/config/ressourcenformate.json
          $CHANGED_ONLY
