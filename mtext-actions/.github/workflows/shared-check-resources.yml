name: Shared Workflow – Konfigurations- und Ressourcenprüfung

# Dieser Workflow prüft die Mandantenkonfiguration. Die Prüfung der JSON- und
# XML-Ressourcen ist optional und bei Pull Requests auf geänderte Dateien begrenzt.
'on':
  workflow_call:
    inputs:
      commit_sha:
        description: Commit im Mandanten-Repository, dessen Stand geprüft wird
        required: true
        type: string
      check_resources:
        description: JSON- und XML-Ressourcen prüfen
        required: false
        default: true
        type: boolean
      changed_only:
        description: Nur geänderte Ressourcen prüfen
        required: false
        default: false
        type: boolean
    secrets:
      automation_token:
        description: Token zum Laden der zentralen CI/CD-Implementierung
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Mandantenkonfiguration und Ressourcen prüfen
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Check-Out Mandanten-Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          # Bei geänderten Ressourcen wird der vorherige Commit für den Diff benötigt
          fetch-depth: ${{ inputs.check_resources && inputs.changed_only && 2 || 1 }}
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: main
          path: automation
          persist-credentials: false
          token: ${{ secrets.automation_token }}

      - name: Python-Runtime ermitteln
        id: runtime
        run: bash automation/scripts/runner-preflight.sh

      - name: Mandantenkonfiguration prüfen
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/mtext.py
          validate-config

      # Pull Requests prüfen den Diff, manuelle Vollprüfungen den gesamten Stand.
      - name: Ressourcen prüfen
        if: inputs.check_resources
        env:
          CHANGED_ONLY: ${{ inputs.changed_only && '--changed-only' || '' }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/mtext.py check-resources
          --root source
          --formats automation/config/ressourcenformate.json
          $CHANGED_ONLY
