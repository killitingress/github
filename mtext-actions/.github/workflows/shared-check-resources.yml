name: Shared Workflow – Tonic-Ressourcen prüfen

# Shared Workflow zur Prüfung der Tonic-Ressourcen des angegebenen Mandanten-
# Repositories. Bei Pull-Requests werden nur die geänderten Elemente
# geprüft, bei manuellem Lauf der gesamte Stand (ohne excluded_projects).
'on':
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Mandantenkonfiguration und Ressourcen prüfen
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      # Für Pull Requests wird der Vorgänger für den Änderungsvergleich geladen.
      - name: Check-Out Mandantenstand
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false

      # Starte die Composite Action "action.yml"
      - name: action.yml ausführen
        id: automation
        uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions@main

      # Prüft die Tonic-Ressourcen des Mandanten-Repositories
      - name: Ressourcen prüfen
        env:
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
        run: >-
          "${{ steps.automation.outputs.python }}" "$ACTION_PATH/src/mtext.py" resources check
