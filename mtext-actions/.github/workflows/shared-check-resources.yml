name: Shared Workflow – Tonic-Ressourcen prüfen

# Shared Workflow zur Prüfung der Mandantenkonfiguration und der Ressourcen.
# Der Aufruf bestimmt einen Vollstand oder den DELTA-Umfang der folgenden
# Lieferung oder Synchronisierung. Ausgeschlossene Projekte entfallen.
'on':
  workflow_call:
    inputs:
      lieferung:
        description: Umfang der folgenden Lieferung verwenden
        required: false
        type: boolean
        default: false
      synchronisierung:
        description: Vergleichsumfang der folgenden Synchronisierung verwenden
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # Der aufrufende Sync-Workflow gewährt diese Berechtigung für seinen Vergleichsstand.
  actions: read

jobs:
  check:
    name: Mandantenkonfiguration und Ressourcen prüfen
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - name: Check-Out Mandantenstand
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: ${{ (inputs.lieferung || inputs.synchronisierung) && '0' || '1' }}
          persist-credentials: false

      # Starte die Composite Action "action.yml"
      - name: action.yml ausführen
        id: automation
        uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions@main

      # Prüft die Tonic-Ressourcen des Mandanten-Repositories
      - name: Ressourcen prüfen
        env:
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          GITHUB_TOKEN: ${{ inputs.synchronisierung && github.token || '' }}
        run: >-
          "${{ steps.automation.outputs.python }}" "$ACTION_PATH/src/mtext.py" resources check
          ${{ inputs.lieferung && '--delivery-scope' || '' }}
          ${{ inputs.synchronisierung && '--sync-scope' || '' }}
