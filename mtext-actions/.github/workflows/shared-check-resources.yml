name: Shared Workflow – Mandantenkonfiguration und Ressourcen prüfen

# Dieser Workflow prüft den Mandantenstand des aufrufenden Laufs. Die
# Mandantenkonfiguration wird in jedem Lauf gegen die gemeinsamen Zuordnungen
# geprüft. Pull Requests prüfen geänderte JSON- und XML-Ressourcen sowie bei
# verfügbarem Node.js auch JavaScript und laden dafür den Vorgänger. Manuelle
# Läufe prüfen den gesamten Stand. Die Prüfung greift nicht auf M/Text oder den
# Mainframe zu.
'on':
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Mandantenkonfiguration und Ressourcen prüfen
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      # Für Pull Requests wird der Vorgänger für den Änderungsvergleich geladen.
      - name: Check-Out Mandantenstand
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false

      # Lädt Implementierung und Konfiguration aus der gemeinsamen Action und
      # prüft zugleich die Python-Runtime des Runners.
      - name: M/Text-Automatisierung laden
        id: automation
        uses: FI-Actions/fi_lbs_entw_oms_mtext_actions@main

      # Prüft die gemeinsame Zuordnung und die Konfiguration des Mandanten
      - name: Mandantenkonfiguration prüfen
        env:
          AUTOMATION_PATH: ${{ steps.automation.outputs.automation_path }}
        run: '"${{ steps.automation.outputs.python }}" "$AUTOMATION_PATH/src/mtext.py" config validate'

      # Pull Requests prüfen geänderte Ressourcen, manuelle Läufe den gesamten Stand
      - name: Ressourcen prüfen
        env:
          AUTOMATION_PATH: ${{ steps.automation.outputs.automation_path }}
        run: >-
          "${{ steps.automation.outputs.python }}" "$AUTOMATION_PATH/src/mtext.py" resources check
