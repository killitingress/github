name: Reusable release

# Dieser wiederverwendbare Workflow erzeugt aus einem Release-Tag ein FULL- oder
# DELTA-Artefakt, übergibt es an den Mainframe und veröffentlicht anschließend
# die lesbare Rückmeldung im Mandanten-Repository.
'on':
  workflow_call:
    inputs:
      source_repository:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      trigger_sha:
        required: false
        default: ''
        type: string
      automation_ref:
        required: true
        type: string
      retention_days:
        required: false
        default: 30
        type: number
      serialize_publication:
        description: Serialisiert Mainframe-Übergaben innerhalb eines Mandanten-Repositories
        required: false
        default: true
        type: boolean
    secrets:
      source_token:
        required: true
      mainframe_ftp_password:
        required: true

permissions:
  contents: read

jobs:
  # Dieser Job besitzt keinen Zugriff auf Bereitstellungsdaten und erzeugt ausschließlich Release-Dateien.
  build:
    name: Build FULL or DELTA artifact
    # Das Platzhalter-Label wird durch das offizielle runs-on-Kennzeichen des
    # von der FI bereitgestellten Runners ersetzt.
    runs-on: FI_RUNNER_LABEL_TO_BE_SET
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      # Lädt den durch den Release-Tag bezeichneten Mandanten-Commit mit seiner
      # Historie, damit Tag, Vorgänger-Release und Änderungsumfang geprüft werden können.
      - name: Check out tagged mandant commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          repository: ${{ inputs.source_repository }}
          ref: refs/tags/${{ inputs.release_tag }}
          token: ${{ secrets.source_token }}

      # Lädt die festgelegte CI/CD-Version mit der Build-Logik und speichert
      # keine GitHub-Zugangsdaten in der Git-Konfiguration.
      - name: Check out selected CI/CD version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ inputs.automation_ref }}
          path: automation
          persist-credentials: false

      # Prüft den von der FI bereitgestellten Runner und stellt den Pfad zur vorgegebenen
      # Python-Laufzeit als Ausgabe für den Build bereit.
      - name: Prepare approved Python runtime
        id: runtime
        run: automation/scripts/runner-preflight.sh

      # Prüft Tag und Mandantenkonfiguration, ermittelt FULL oder DELTA und
      # erzeugt Release-Dateien, Manifest und Prüfsummen im Verzeichnis dist.
      - name: Build release and manifest
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_TRIGGER_SHA: ${{ inputs.trigger_sha }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/build_release.py
          --tag "$INPUT_RELEASE_TAG"
          --trigger-sha "$INPUT_TRIGGER_SHA"

      # Bildet aus Repository und Release-Tag einen eindeutigen Artefaktnamen und
      # stellt ihn dem Upload sowie dem nachfolgenden Veröffentlichungsjob bereit.
      - name: Define artifact identity
        id: metadata
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: |
          repository_short="${SOURCE_REPOSITORY##*/}"
          printf 'artifact_name=%s-%s\n' "$repository_short" "$INPUT_RELEASE_TAG" >> "$GITHUB_OUTPUT"

      # Speichert den vollständigen dist-Inhalt ohne zusätzliche Komprimierung
      # als Laufartefakt; fehlende Build-Ausgaben lassen den Job fehlschlagen.
      - name: Store release artifact
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          compression-level: 0

  # Erst dieser Job erhält das zentrale FTP-Secret und darf externe Systeme ansprechen.
  publish:
    name: Verify and hand over artifact to Mainframe
    needs: build
    # Auch der Publish-Job verwendet ausschließlich den zentral
    # festgelegten Runner der FI und keine Auswahl des Mandanten-Workflows.
    runs-on: FI_RUNNER_LABEL_TO_BE_SET
    concurrency:
      group: ${{ inputs.serialize_publication && format('mainframe-{0}', inputs.source_repository) || format('mainframe-{0}-{1}', inputs.source_repository, github.run_id) }}
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      # Lädt die festgelegte CI/CD-Version mit Übergabelogik und JCL-Vorlage,
      # ohne GitHub-Zugangsdaten in der Git-Konfiguration zu speichern.
      - name: Check out selected CI/CD version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ inputs.automation_ref }}
          path: automation
          persist-credentials: false

      # Lädt ausschließlich das vom Build-Job dieses Workflow-Laufs benannte
      # Release-Artefakt in das lokale Verzeichnis dist.
      - name: Download exact release artifact
        uses: actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      # Prüft den von der FI bereitgestellten Runner und stellt den Pfad zur vorgegebenen
      # Python-Laufzeit als Ausgabe für die Mainframe-Übergabe bereit.
      - name: Prepare approved Python runtime
        id: runtime
        run: automation/scripts/runner-preflight.sh

      # Validiert Manifest und Prüfsummen erneut, überträgt das Artefakt per FTP,
      # rendert die JCL in einem temporären Verzeichnis und reicht sie bei JES ein.
      - name: Verify artifact, render JCL and submit FTP/JES
        env:
          MAINFRAME_FTP_HOST: ${{ vars.MAINFRAME_FTP_HOST }}
          MAINFRAME_FTP_PASSWORD: ${{ secrets.mainframe_ftp_password }}
          MAINFRAME_FTP_USER: ${{ vars.MAINFRAME_FTP_USER }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/publish_mainframe.py

  # Die Rückmeldung beginnt erst nach der erfolgreichen Mainframe-Übergabe.
  # Ein Fehler in diesem Job kann deshalb wiederholt werden, ohne erneut zu übertragen.
  report:
    name: Publish delivery report in mandant repository
    needs: [build, publish]
    runs-on: FI_RUNNER_LABEL_TO_BE_SET
    timeout-minutes: 15
    steps:
      # Lädt die zum Release gehörende CI/CD-Version ohne gespeicherte
      # Zugangsdaten. Das Mandanten-Token erhält erst der Veröffentlichungsschritt.
      - name: Check out selected CI/CD version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ inputs.automation_ref }}
          path: automation
          persist-credentials: false

      # Verwendet dasselbe geprüfte Artefakt wie die Mainframe-Übergabe.
      - name: Download exact release artifact
        uses: actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      # Stellt die auf dem FI-Runner vorgegebene Python-Laufzeit bereit.
      - name: Prepare approved Python runtime
        id: runtime
        run: automation/scripts/runner-preflight.sh

      # Legt das GitHub Release für den vorhandenen Tag an. Bei einer Wiederholung
      # werden Beschreibung und gleichnamige Informationsdateien aktualisiert.
      - name: Publish GitHub release and information files
        env:
          MANDANT_REPOSITORY_TOKEN: ${{ secrets.source_token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/publish_github_release.py
