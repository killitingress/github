name: Wiederverwendbares Release

# Dieser Workflow erstellt und veröffentlicht ein FULL- oder DELTA-Artefakt
'on':
  workflow_call:
    inputs:
      source_repository:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      trigger_sha:
        required: false
        default: ''
        type: string
      automation_ref:
        required: true
        type: string
      retention_days:
        required: false
        default: 30
        type: number
      serialize_publication:
        description: Serialisiert Mainframe-Übergaben innerhalb eines Mandanten-Repositories
        required: false
        default: true
        type: boolean
    secrets:
      source_token:
        required: true
      mainframe_ftp_password:
        required: true

permissions:
  contents: read

jobs:
  # Erstellt die Release-Dateien ohne Zugriff auf die Mainframe-Zugangsdaten
  build:
    name: Erstellt FULL- oder DELTA-Artefakt
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      # Lädt den getaggten Mandanten-Commit mit seiner Historie in den Arbeitsbereich
      - name: Check-Out getaggter Mandanten-Commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          repository: ${{ inputs.source_repository }}
          ref: refs/tags/${{ inputs.release_tag }}
          token: ${{ secrets.source_token }}

      # Lädt die festgelegte CI/CD-Version mit der Build-Logik
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ inputs.automation_ref }}
          path: automation
          persist-credentials: false

      # Prüft den Runner und stellt den Pfad zur Python-Laufzeit als Ausgabe bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: automation/scripts/runner-preflight.sh

      # Erstellt Release-Dateien, Manifest und Prüfsummen im Verzeichnis dist
      - name: Release und Manifest erstellen
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_TRIGGER_SHA: ${{ inputs.trigger_sha }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/build_release.py
          --tag "$INPUT_RELEASE_TAG"
          --trigger-sha "$INPUT_TRIGGER_SHA"

      # Bildet den Artefaktnamen aus Repository und Release-Tag
      - name: Artefaktnamen ermitteln
        id: metadata
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: |
          repository_short="${SOURCE_REPOSITORY##*/}"
          printf 'artifact_name=%s-%s\n' "$repository_short" "$INPUT_RELEASE_TAG" >> "$GITHUB_OUTPUT"

      # Speichert den Inhalt von dist als Laufartefakt
      - name: Release-Artefakt speichern
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
          compression-level: 0

  # Übergibt das Artefakt mit den zentralen Mainframe-Zugangsdaten
  publish:
    name: Prüft und übergibt Artefakt an Mainframe
    needs: build
    runs-on: [self-hosted, linux]
    concurrency:
      group: ${{ inputs.serialize_publication && format('mainframe-{0}', inputs.source_repository) || format('mainframe-{0}-{1}', inputs.source_repository, github.run_id) }}
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      # Lädt die festgelegte CI/CD-Version mit Übergabelogik und JCL-Vorlage
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ inputs.automation_ref }}
          path: automation
          persist-credentials: false

      # Lädt das erstellte Release-Artefakt in das Verzeichnis dist
      - name: Release-Artefakt herunterladen
        uses: actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      # Prüft den Runner und stellt den Pfad zur Python-Laufzeit als Ausgabe bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: automation/scripts/runner-preflight.sh

      # Prüft das Artefakt, überträgt es per FTP und reicht die JCL bei JES ein
      - name: Artefakt an Mainframe übergeben
        env:
          MAINFRAME_FTP_HOST: ${{ vars.MAINFRAME_FTP_HOST }}
          MAINFRAME_FTP_PASSWORD: ${{ secrets.mainframe_ftp_password }}
          MAINFRAME_FTP_USER: ${{ vars.MAINFRAME_FTP_USER }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/publish_mainframe.py

  # Veröffentlicht die Rückmeldung nach erfolgreicher Mainframe-Übergabe
  report:
    name: Veröffentlicht Bereitstellungsbericht im Mandanten-Repository
    needs: [build, publish]
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      # Lädt die zum Release gehörende CI/CD-Version
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ inputs.automation_ref }}
          path: automation
          persist-credentials: false

      # Lädt das an den Mainframe übergebene Release-Artefakt
      - name: Release-Artefakt herunterladen
        uses: actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      # Prüft den Runner und stellt den Pfad zur Python-Laufzeit als Ausgabe bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: automation/scripts/runner-preflight.sh

      # Veröffentlicht das GitHub Release und die Informationsdateien
      - name: GitHub Release veröffentlichen
        env:
          MANDANT_REPOSITORY_TOKEN: ${{ secrets.source_token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/publish_github_release.py
