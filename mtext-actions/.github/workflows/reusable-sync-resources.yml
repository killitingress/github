name: Reusable M/Text resource sync

# Dieser wiederverwendbare Workflow prüft und paketiert einen unveränderlichen
# Mandanten-Commit und übergibt dessen Ressourcen synchron an die festgelegte M/Text-Stufe.
'on':
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      automation_ref:
        required: true
        type: string
    secrets:
      automation_token:
        required: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync exact commit to M/Text
    # Das Platzhalter-Label wird durch das offizielle runs-on-Kennzeichen des
    # von der FI bereitgestellten Runners ersetzt.
    runs-on: FI_RUNNER_LABEL_TO_BE_SET
    timeout-minutes: 30
    steps:
      # Lädt den vollständig aufgelösten Mandanten-Commit einschließlich seiner
      # Historie, damit Branch-Zugehörigkeit und Vorgängerstände geprüft werden können.
      - name: Check out mandant repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      # Lädt genau die vom Aufrufer freigegebene CI/CD-Version, ohne
      # Zugangsdaten in der Git-Konfiguration zu speichern.
      - name: Check out selected CI/CD version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ inputs.automation_ref }}
          path: automation
          persist-credentials: false
          token: ${{ secrets.automation_token }}

      # Prüft den von der FI bereitgestellten Runner und stellt den Pfad zur vorgegebenen
      # Python-Laufzeit als Ausgabe für die Synchronisation bereit.
      - name: Prepare approved Python runtime
        id: runtime
        run: automation/scripts/runner-preflight.sh

      # Validiert Mandantenkonfiguration, Branch und Commit. Manuelle Starts
      # führen einen Vollabgleich mit dem branchabhängigen Ziel aus. Ändert ein
      # main-Push die Releaselinie, werden Entwicklung und Abnahme initial versorgt.
      - name: Publish to serverSync and call adapter
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          MTEXT_PREVIOUS_COMMIT: ${{ github.event.before || '' }}
        run: >-
          "${{ steps.runtime.outputs.python }}"
          automation/src/sync_resources.py
          --commit "$INPUT_COMMIT_SHA"
