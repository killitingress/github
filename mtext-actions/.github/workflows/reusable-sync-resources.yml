name: Wiederverwendbare M/Text-Ressourcensynchronisierung

# Dieser Workflow synchronisiert Ressourcen mit M/Text
'on':
  workflow_call:
    inputs:
      commit_sha:
        description: Commit im Mandanten-Repository, dessen Ressourcen synchronisiert werden
        required: true
        type: string
      automation_ref:
        description: CI/CD-Version, aus der dieser Workflow geladen wurde
        required: true
        type: string
    secrets:
      automation_token:
        description: Token zum Laden der festgelegten CI/CD-Version
        required: true

permissions:
  contents: read

jobs:
  sync:
    name: Ressourcen mit M/Text synchronisieren
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      # Lädt den angegebenen Commit mit seiner Historie
      - name: Check-Out Mandanten-Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      # Lädt die Skripte für die Synchronisierung
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ inputs.automation_ref }}
          path: automation
          persist-credentials: false
          token: ${{ secrets.automation_token }}

      # Prüft Git und Python und stellt den Python-Pfad bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: bash automation/scripts/runner-preflight.sh

      # Prüft den Commit und synchronisiert die Ressourcen mit der M/Text-Stufe
      - name: Ressourcen synchronisieren
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          # Der Runner und der Adapter greifen auf denselben CIFS-Basispfad zu
          MTEXT_CIFS_ROOT: ${{ vars.MTEXT_CIFS_ROOT }}
          MTEXT_PREVIOUS_COMMIT: ${{ github.event.before || '' }}
        run: >-
          "${{ steps.runtime.outputs.python }}"
          automation/src/mtext.py sync-resources
          --commit "$INPUT_COMMIT_SHA"
