name: Wiederverwendbare M/Text-Ressourcensynchronisierung

# Dieser Workflow synchronisiert die Ressourcen eines Mandanten-Commits mit M/Text
'on':
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      automation_ref:
        required: true
        type: string
    secrets:
      automation_token:
        required: true

permissions:
  contents: read

jobs:
  sync:
    name: Synchronisiert Mandanten-Commit mit M/Text
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      # Lädt den Mandanten-Commit mit seiner Historie in den Arbeitsbereich
      - name: Check-Out Mandanten-Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      # Lädt die freigegebene CI/CD-Version in den Arbeitsbereich
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ inputs.automation_ref }}
          path: automation
          persist-credentials: false
          token: ${{ secrets.automation_token }}

      # Prüft den Runner und stellt den Pfad zur Python-Laufzeit als Ausgabe bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: automation/scripts/runner-preflight.sh

      # Prüft den Mandantenstand und synchronisiert die Ressourcen mit der M/Text-Stufe
      - name: Ressourcen synchronisieren
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          MTEXT_PREVIOUS_COMMIT: ${{ github.event.before || '' }}
        run: >-
          "${{ steps.runtime.outputs.python }}"
          automation/src/sync_resources.py
          --commit "$INPUT_COMMIT_SHA"
