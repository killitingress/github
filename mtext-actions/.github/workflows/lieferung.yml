name: Zentrale Lieferung

# Dieser Workflow verarbeitet eine bestätigte erstmalige Lieferung oder
# wiederholt einen vorhandenen Lieferstand. Bei einer erstmaligen Lieferung
# erstellt er den Liefer-Tag auf der festgehaltenen SHA. Bei einer Wiederholung
# verwendet er den vorhandenen Tag. Anschließend baut er das FULL- oder
# DELTA-Artefakt, übergibt die Pakete und JCL an den Mainframe und veröffentlicht
# den Bereitstellungsbericht im Mandanten-Repository. Ein Tag-Push allein startet
# diesen Ablauf nicht.
'on':
  workflow_dispatch:
    inputs:
      source_repository:
        description: Mandanten-Repository, aus dem die Lieferung erstellt wird
        required: true
        type: string
      lieferung_tag:
        description: Liefer-Tag, zum Beispiel r261.108
        required: true
        type: string
      source_sha:
        description: Commit des Liefer-Tags oder der Vorbereitung
        required: true
        type: string
      source_branch:
        description: Branch der Vorbereitung bei einer erstmaligen Lieferung
        required: false
        type: string
      wiederholung:
        description: Vorhandenen Liefer-Tag erneut ausführen
        required: true
        type: boolean
permissions:
  contents: read

jobs:
  tag:
    name: Liefer-Tag erstellen
    if: ${{ !inputs.wiederholung }}
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      # Lädt die festgehaltene SHA mit ihrer Historie. Die aktuelle
      # Branchspitze wird nicht als neuer Lieferstand gelesen.
      - name: Check-Out Mandantenstand
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.WORKFLOW_CONFIGURATION_TOKEN }}

      # Lädt die Implementierung aus demselben Commit wie diesen Workflow
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false

      # Prüft Git und Python und stellt den Python-Pfad bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: bash automation/scripts/runner-preflight.sh

      # Der Tag zeigt auf die in der bestätigten Vorbereitung festgehaltene SHA.
      - name: Liefer-Tag erstellen
        env:
          PYTHON: ${{ steps.runtime.outputs.python }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          WORKFLOW_CONFIGURATION_TOKEN: ${{ secrets.WORKFLOW_CONFIGURATION_TOKEN }}
          LIEFERUNG_TAG: ${{ inputs.lieferung_tag }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: >-
          "$PYTHON" automation/src/mtext.py lieferung tag
          --tag "$LIEFERUNG_TAG"
          --branch "$SOURCE_BRANCH"
          --source-sha "$SOURCE_SHA"
          --api-url "$GITHUB_API_URL"

  # Erstellt die Pakete mit ihrer JCL und den JSON-Informationsdateien
  # Ein Tag-Push allein löst keine Mainframe-Übergabe aus.
  build:
    name: FULL- oder DELTA-Artefakt erstellen
    needs: tag
    if: ${{ always() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.pakete.outputs.source_sha }}
    steps:
      # Lädt den Commit des Liefer-Tags mit seiner Historie
      - name: Check-Out Liefer-Tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false
          repository: ${{ inputs.source_repository }}
          ref: refs/tags/${{ inputs.lieferung_tag }}
          token: ${{ secrets.WORKFLOW_CONFIGURATION_TOKEN }}

      # Lädt die Implementierung aus demselben Commit wie diesen Workflow
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false

      # Prüft Git und Python und stellt den Python-Pfad bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: bash automation/scripts/runner-preflight.sh

      # Schreibt alle Dateien für die Mainframe-Übergabe nach dist
      - name: Lieferdateien erstellen
        id: pakete
        env:
          INPUT_RELEASE_TAG: ${{ inputs.lieferung_tag }}
          INPUT_TRIGGER_SHA: ${{ inputs.source_sha }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/mtext.py build-release
          --tag "$INPUT_RELEASE_TAG"
          --trigger-sha "$INPUT_TRIGGER_SHA"

      # Speichert den Inhalt von dist als Laufartefakt
      - name: Lieferartefakt speichern
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Die Mainframe-Zugangsdaten sind nur in diesem Job verfügbar
  publish:
    name: Lieferung an Mainframe übergeben
    needs: build
    runs-on: [self-hosted, linux]
    concurrency:
      group: mainframe-${{ inputs.source_repository }}
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      # Lädt die Implementierung aus demselben Commit wie diesen Workflow
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false

      # Lädt das Lieferartefakt in das für diesen Job geleerte temporäre Verzeichnis
      - name: Lieferartefakt herunterladen
        uses: actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: release
          path: ${{ runner.temp }}/release

      # Prüft Git und Python und stellt den Python-Pfad bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: bash automation/scripts/runner-preflight.sh

      # Überträgt jedes Paket per FTPS und reicht seine JCL bei JES ein
      - name: Lieferung an Mainframe übergeben
        env:
          MAINFRAME_FTPS_HOST: ${{ vars.MAINFRAME_FTPS_HOST }}
          MAINFRAME_FTPS_PASSWORD: ${{ secrets.MAINFRAME_FTPS_PASSWORD }}
          MAINFRAME_FTPS_PORT: ${{ vars.MAINFRAME_FTPS_PORT }}
          MAINFRAME_FTPS_USER: ${{ vars.MAINFRAME_FTPS_USER }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/release
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/mtext.py publish-mainframe

  # Veröffentlicht das GitHub Release nach der Mainframe-Übergabe
  report:
    name: Bereitstellungsbericht im Mandanten-Repository veröffentlichen
    needs: [build, publish]
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      # Lädt die Implementierung aus demselben Commit wie diesen Workflow
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false

      # Lädt das Lieferartefakt in das für diesen Job geleerte temporäre Verzeichnis
      - name: Lieferartefakt herunterladen
        uses: actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: release
          path: ${{ runner.temp }}/release

      # Prüft Git und Python und stellt den Python-Pfad bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: bash automation/scripts/runner-preflight.sh

      # Veröffentlicht das GitHub Release und die Informationsdateien
      - name: GitHub Release veröffentlichen
        env:
          MANDANT_REPOSITORY_TOKEN: ${{ secrets.WORKFLOW_CONFIGURATION_TOKEN }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/release
          RELEASE_TAG: ${{ inputs.lieferung_tag }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          TRIGGER_SHA: ${{ inputs.source_sha || needs.build.outputs.source_sha }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/mtext.py publish-github-release
