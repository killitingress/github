name: Wiederverwendbarer Start des Freigabe-Abschlusses

# Der Mandanten-Workflow meldet den zusammengeführten Freigabe-Pull-Request an
# das zentrale Repository. Dort liegt die technische Identität, mit der der
# Release-Tag im Mandanten-Repository entsteht.
'on':
  workflow_call:
    inputs:
      source_repository:
        description: Mandanten-Repository der Release-Freigabe
        required: true
        type: string
      source_branch:
        description: Zielbranch des Freigabe-Pull-Requests
        required: true
        type: string
      approval_branch:
        description: Zusammengeführter Freigabe-Branch
        required: true
        type: string
      merge_sha:
        description: Merge-Commit des Freigabe-Pull-Requests
        required: true
        type: string
      pull_request_number:
        description: Nummer des Freigabe-Pull-Requests
        required: true
        type: string
      target_repository:
        description: Repository mit dem zentralen Freigabe-Workflow
        required: true
        type: string
      automation_ref:
        description: Festgelegte CI/CD-Version
        required: true
        type: string
    secrets:
      dispatch_token:
        description: Token zum Starten des zentralen Workflows
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    name: Zentralen Freigabe-Abschluss starten
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      # GitHub lädt release-approval-finalize.yml aus main. Der gestartete
      # Workflow lädt seine Skripte anschließend aus AUTOMATION_REF.
      - name: Zentralen Freigabe-Workflow starten
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          DISPATCH_TOKEN: ${{ secrets.dispatch_token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          APPROVAL_BRANCH: ${{ inputs.approval_branch }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          AUTOMATION_REF: ${{ inputs.automation_ref }}
        run: |
          # Die Dispatch-Daten werden von Python als JSON serialisiert. Damit
          # bleiben Eingaben mit Anführungszeichen oder Zeilenumbrüchen Daten.
          request_body="$(python3 -c 'import json, os; print(json.dumps({"ref": "main", "inputs": {"source_repository": os.environ["SOURCE_REPOSITORY"], "source_branch": os.environ["SOURCE_BRANCH"], "approval_branch": os.environ["APPROVAL_BRANCH"], "merge_sha": os.environ["MERGE_SHA"], "pull_request_number": os.environ["PULL_REQUEST_NUMBER"], "automation_ref": os.environ["AUTOMATION_REF"]}}))')"
          curl --fail --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$request_body" \
            "$GITHUB_API_URL/repos/$TARGET_REPOSITORY/actions/workflows/release-approval-finalize.yml/dispatches"
