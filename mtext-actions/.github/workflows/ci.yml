name: Zentrale Testsuite

# Dieser Workflow führt die zentralen Python-Tests bei Pull Requests und
# Änderungen an main aus
'on':
  pull_request:
  push:
    branches:
      - main

# Beschränkt GITHUB_TOKEN auf Lesezugriff für dieses Repository (für Check-Out)
permissions:
  contents: read

# Neuere Commits ersetzen laufende Tests derselben Änderung
concurrency:
  group: central-tests-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Zentrale CI/CD-Implementierung testen
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      # Lädt die zu prüfende CI/CD-Version in den Arbeitsbereich
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Prüft Git und Python auf dem Runner und stellt den Python-Pfad bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: bash scripts/runner-preflight.sh

      # Führt alle Unit-Tests aus
      - name: Unit-Tests ausführen
        env:
          PYTHONPATH: src
        run: >-
          "${{ steps.runtime.outputs.python }}" -m unittest discover
          -s tests -v
