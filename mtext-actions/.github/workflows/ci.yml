name: M/Text-Automatisierung testen

# Dieser Workflow prüft mtext_actions bei Pull Requests, Änderungen an main und
# einem manuellen Start.
# Er lädt den betroffenen Repository-Stand, ermittelt die verfügbare
# Python-Runtime und führt die Unit-Tests aus. Die Tests sprechen natürlich
# weder M/Text noch den Mainframe an.
# Ein erfolgreicher Lauf bestätigt die Ausführbarkeit der Python-Abläufe auf dem
# Runner und deren Korrektheit.
'on':
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

# Beschränkt GITHUB_TOKEN auf Lesezugriff für dieses Repository (für Check-Out)
permissions:
  contents: read

# Neuere Commits ersetzen laufende Tests derselben Änderung
concurrency:
  group: mtext-actions-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI/CD-Implementierung testen
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      # Lädt die zu prüfende CI/CD-Version in den Arbeitsbereich
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Prüft denselben Ladevertrag, den die Mandanten-Workflows verwenden.
      - name: M/Text-Automatisierung laden
        id: automation
        uses: ./

      # Workflow-Dateien mit actionlint prüfen, sobald der Runner das Kommando
      # bereitstellt.
      # - name: Workflow-Dateien prüfen
      #   run: actionlint

      # Führt alle Unit-Tests aus
      - name: Unit-Tests ausführen
        env:
          AUTOMATION_PATH: ${{ steps.automation.outputs.automation_path }}
          PYTHONPATH: ${{ steps.automation.outputs.automation_path }}/src
        run: '"${{ steps.automation.outputs.python }}" -m unittest discover -s "$AUTOMATION_PATH/tests" -v'
