name: Zentrale Testsuite

# Dieser Workflow führt bei Pull Requests und Änderungen an main alle zentralen
# Python-Tests aus
'on':
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Neuere Commits ersetzen laufende Tests derselben Änderung.
concurrency:
  group: central-tests-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testet Zentrale CI/CD-Implementierung
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      # Lädt die zu prüfende CI/CD-Version in den Arbeitsbereich
      - name: Check-Out CI/CD Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Prüft den Runner und stellt den Pfad zur Python-Laufzeit als Ausgabe für die nachfolgenden Schritte bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: bash scripts/runner-preflight.sh

      # Startet die vollständige Unit-Test-Suite (mit dem produktiven Quellcode)
      - name: Ausführung Unit-Tests
        env:
          PYTHONPATH: src
        run: >-
          "${{ steps.runtime.outputs.python }}" -m unittest discover
          -s tests -v
