name: Action-Aufrufe für Übernahme umstellen

# Beim Anlegen des Branches test stellt dieser Workflow die internen Aufrufe auf
# @test um. Vor dem Merge nach main ersetzt er @test durch @main, damit main
# nach der Übernahme keine Testversion aufruft. Nach Abschluss des Pull Requests
# stellt er die Aufrufe auf test wieder auf @test zurück.
'on':
  create:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, closed]

permissions:
  # startet nach dem Bot-Commit den Unit-Test-Workflow über die GitHub-API
  actions: write
  # schreibt die geänderten Workflow-Dateien nach test
  contents: write

# Branch-Erstellung und Pull-Request-Ereignisse dürfen nicht gleichzeitig nach test schreiben.
concurrency:
  group: mtext-actions-test-ausrichten
  cancel-in-progress: true

jobs:
  refs:
    name: Interne Action-Aufrufe umstellen
    if: >-
      (github.event_name == 'create' &&
       github.event.ref_type == 'branch' &&
       github.event.ref == 'test') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'test' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    env:
      TARGET_REF: ${{ (github.event_name == 'create' || github.event.action == 'closed') && 'test' || 'main' }}
    steps:
      # GITHUB_TOKEN bleibt im Checkout hinterlegt, damit git push nach test schreiben kann.
      - name: test laden
        uses: actions/checkout@v4
        with:
          ref: test
          path: target

      # Beim Anlegen und nach dem Pull Request gilt @test, im offenen Pull Request @main.
      - name: Interne Action-Aufrufe umstellen
        run: >-
          sed -i -E
          "s#(FinanzInformatik/fi_lbs_entw_oms_mtext_actions[^@[:space:]]*@)(main|test)#\1${TARGET_REF}#g"
          target/.github/workflows/*.yml

      # Nur eine tatsächliche Ersetzung wird als neuer Commit nach test geschrieben.
      - name: Änderung nach test schreiben
        id: write
        working-directory: target
        run: |
          if git diff --quiet -- .github/workflows; then
            echo "Interne Action-Aufrufe verwenden bereits @$TARGET_REF."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "Interne Action-Aufrufe auf @$TARGET_REF umstellen"
          git push origin HEAD:test
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Der Commit mit GITHUB_TOKEN startet die Unit-Tests nicht automatisch.
      - name: Unit-Tests für neuen Stand starten
        if: steps.write.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            --data '{"ref":"test"}'
