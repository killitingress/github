name: Update mandant workflows

# Dieser manuell gestartete Batch bereitet für main und bestehende
# Release-Branches Pull Requests mit der freigegebenen CI/CD-Version vor.
# Geschützte Zielbranches werden nicht direkt beschrieben.
'on':
  workflow_dispatch:
    inputs:
      automation_sha:
        description: Vollständige Commit-SHA der freigegebenen CI/CD-Version
        required: true
        type: string

permissions:
  contents: read

# Zwei Rollouts dürfen nicht gleichzeitig unterschiedliche Aktualisierungen
# für dieselben Mandanten-Repositories vorbereiten.
concurrency:
  group: mandanten-aktualisierung
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify rollout and build matrix
    runs-on: ${{ vars.FI_RUNNER_LABEL }}
    timeout-minutes: 10
    outputs:
      rollout_sha: ${{ steps.rollout.outputs.rollout_sha }}
      update_matrix: ${{ steps.rollout.outputs.update_matrix }}
    steps:
      # Die CI/CD-Version wurde zuvor über einen Pull Request geprüft. Der Batch
      # lädt genau diese SHA und erzeugt keinen zentralen Bootstrap-Commit.
      - name: Check out approved CI/CD version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          path: automation
          persist-credentials: false
          ref: ${{ inputs.automation_sha }}

      - name: Prepare approved Python runtime
        id: runtime
        run: automation/scripts/runner-preflight.sh

      - name: Verify central rollout version
        env:
          AUTOMATION_SHA: ${{ inputs.automation_sha }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/workflow_configuration.py
          verify-automation
          --automation-sha "$AUTOMATION_SHA"

      # Die Matrix enthält main und mögliche Release-Branches. Ein späterer
      # Schritt überspringt Release-Branches, die im Mandanten nicht bestehen.
      - name: Build protected branch matrix
        id: rollout
        env:
          AUTOMATION_SHA: ${{ inputs.automation_sha }}
        run: |
          update_matrix="$(
            "${{ steps.runtime.outputs.python }}" automation/src/workflow_configuration.py update-matrix
          )"
          printf 'rollout_sha=%s\n' "$AUTOMATION_SHA" >> "$GITHUB_OUTPUT"
          printf 'update_matrix=%s\n' "$update_matrix" >> "$GITHUB_OUTPUT"

  update:
    name: Prepare ${{ matrix.kuerzel }} ${{ matrix.branch }}
    needs: prepare
    runs-on: ${{ vars.FI_RUNNER_LABEL }}
    timeout-minutes: 15
    strategy:
      # Ein Mandantenfehler verhindert nicht die Vorbereitung der übrigen Pull
      # Requests. Schreibzugriffe bleiben trotzdem je Zielbranch getrennt.
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.prepare.outputs.update_matrix) }}
    env:
      GIT_AUTHOR_NAME: mtext_actions Aktualisierung
      GIT_AUTHOR_EMAIL: mtext_actions@users.noreply.github.com
      GIT_COMMITTER_NAME: mtext_actions Aktualisierung
      GIT_COMMITTER_EMAIL: mtext_actions@users.noreply.github.com
    steps:
      - name: Check out central rollout version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          path: automation
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.rollout_sha }}

      - name: Prepare approved Python runtime
        id: runtime
        run: automation/scripts/runner-preflight.sh

      # Die API-Prüfung unterscheidet einen nicht vorhandenen Release-Branch von
      # Berechtigungs- und Verbindungsfehlern des technischen Tokens.
      - name: Check target branch
        id: target
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          TARGET_BRANCH: ${{ matrix.branch }}
          WORKFLOW_CONFIGURATION_TOKEN: ${{ secrets.WORKFLOW_CONFIGURATION_TOKEN }}
        run: |
          exists="$(
            "${{ steps.runtime.outputs.python }}" automation/src/workflow_configuration.py \
            check-target-branch \
            --api-url "$GITHUB_API_URL" \
            --repository "$TARGET_REPOSITORY" \
            --branch "$TARGET_BRANCH"
          )"
          printf 'exists=%s\n' "$exists" >> "$GITHUB_OUTPUT"

      # Der Checkout dient nur als Dateienbestand. Aus dem Mandanten-Repository
      # wird in diesem privilegierten Job kein Programmcode ausgeführt.
      - name: Check out protected mandant branch
        if: steps.target.outputs.exists == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: mandant
          persist-credentials: true
          ref: ${{ matrix.branch }}
          repository: ${{ matrix.repository }}
          token: ${{ secrets.WORKFLOW_CONFIGURATION_TOKEN }}

      - name: Remember target commit
        if: steps.target.outputs.exists == 'true'
        id: before
        run: printf 'sha=%s\n' "$(git -C mandant rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Workflowaufruf und Python-Checkout werden gemeinsam aktualisiert. Der
      # Commit enthält ausschließlich Dateien unter .github/workflows.
      - name: Prepare and verify mandant update
        if: steps.target.outputs.exists == 'true'
        env:
          ROLLOUT_SHA: ${{ needs.prepare.outputs.rollout_sha }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/workflow_configuration.py
          prepare-mandant
          --mandant-root mandant
          --rollout-sha "$ROLLOUT_SHA"

      # Jeder Ausgangsstand erhält einen eindeutigen technischen Branch. Der
      # Batch benötigt dadurch keinen Force-Push und kann bestehende PRs erkennen.
      - name: Push update branch
        if: steps.target.outputs.exists == 'true'
        id: pushed
        env:
          MANDANT_BRANCH: ${{ matrix.branch }}
          ROLLOUT_SHA: ${{ needs.prepare.outputs.rollout_sha }}
          TARGET_SHA: ${{ steps.before.outputs.sha }}
        run: |
          updated_sha="$(git -C mandant rev-parse HEAD)"
          if [[ "$updated_sha" == "$TARGET_SHA" ]]; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch_slug="${MANDANT_BRANCH//\//-}"
          update_branch="mtext_actions/workflow-${branch_slug}-${ROLLOUT_SHA:0:12}-${TARGET_SHA:0:12}"
          git -C mandant push origin "HEAD:refs/heads/$update_branch"
          printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          printf 'branch=%s\n' "$update_branch" >> "$GITHUB_OUTPUT"

      # Der Pull Request unterliegt denselben Reviews und Schutzregeln wie eine
      # fachliche Änderung. Ein HTTP 422 ist bei einem bereits vorhandenen PR
      # derselben technischen Branchkombination ein erfolgreicher Wiederanlauf.
      - name: Open update pull request
        if: steps.pushed.outputs.changed == 'true'
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          TARGET_BRANCH: ${{ matrix.branch }}
          UPDATE_BRANCH: ${{ steps.pushed.outputs.branch }}
          WORKFLOW_CONFIGURATION_TOKEN: ${{ secrets.WORKFLOW_CONFIGURATION_TOKEN }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/workflow_configuration.py
          open-update-pull-request
          --api-url "$GITHUB_API_URL"
          --repository "$TARGET_REPOSITORY"
          --target-branch "$TARGET_BRANCH"
          --update-branch "$UPDATE_BRANCH"
