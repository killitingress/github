name: Mandanten-Workflows aktualisieren

# Dieser Workflow aktualisiert main und bestehende Release-Branches auf die
# angegebene CI/CD-Version
'on':
  workflow_dispatch:
    inputs:
      automation_sha:
        description: CI/CD-Version, auf die die Mandanten-Workflows aktualisiert werden
        required: true
        type: string

permissions:
  contents: read

# Verhindert, dass zwei Läufe gleichzeitig Mandanten-Workflows aktualisieren
concurrency:
  group: mandanten-aktualisierung
  cancel-in-progress: false

jobs:
  prepare:
    name: CI/CD-Version prüfen und Branches ermitteln
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    outputs:
      rollout_sha: ${{ steps.rollout.outputs.rollout_sha }}
      update_matrix: ${{ steps.rollout.outputs.update_matrix }}
    steps:
      # Lädt die angegebene CI/CD-Version in den Arbeitsbereich
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          path: automation
          persist-credentials: false
          ref: ${{ inputs.automation_sha }}

      # Prüft Git und Python und stellt den Python-Pfad bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: bash automation/scripts/runner-preflight.sh

      # Prüft die CI/CD-Version und erstellt die Ziele aus Mandanten und Releaselinien
      - name: Rollout vorbereiten
        id: rollout
        env:
          AUTOMATION_SHA: ${{ inputs.automation_sha }}
        run: |
          update_matrix="$(
            "${{ steps.runtime.outputs.python }}" automation/src/workflow_configuration.py \
            prepare-rollout \
            --automation-sha "$AUTOMATION_SHA"
          )"
          printf 'rollout_sha=%s\n' "$AUTOMATION_SHA" >> "$GITHUB_OUTPUT"
          printf 'update_matrix=%s\n' "$update_matrix" >> "$GITHUB_OUTPUT"

  update:
    name: ${{ matrix.kuerzel }} ${{ matrix.branch }} aktualisieren
    needs: prepare
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    strategy:
      # Ein Fehler verhindert nicht die Aktualisierung der übrigen Zielbranches
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.prepare.outputs.update_matrix) }}
    env:
      GIT_AUTHOR_NAME: mtext_actions Aktualisierung
      GIT_AUTHOR_EMAIL: mtext_actions@users.noreply.github.com
      GIT_COMMITTER_NAME: mtext_actions Aktualisierung
      GIT_COMMITTER_EMAIL: mtext_actions@users.noreply.github.com
    steps:
      # Lädt die geprüfte CI/CD-Version in den Arbeitsbereich
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          path: automation
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.rollout_sha }}

      # Prüft Git und Python und stellt den Python-Pfad bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: bash automation/scripts/runner-preflight.sh

      # Fehlende Repositories und Branches werden mit einer Warnung übersprungen
      - name: Zielbranch prüfen
        id: target
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          TARGET_BRANCH: ${{ matrix.branch }}
          WORKFLOW_CONFIGURATION_TOKEN: ${{ secrets.WORKFLOW_CONFIGURATION_TOKEN }}
        run: |
          exists="$(
            "${{ steps.runtime.outputs.python }}" automation/src/workflow_configuration.py \
            check-target-branch \
            --api-url "$GITHUB_API_URL" \
            --repository "$TARGET_REPOSITORY" \
            --branch "$TARGET_BRANCH"
          )"
          printf 'exists=%s\n' "$exists" >> "$GITHUB_OUTPUT"

      # Lädt den Zielbranch mit Schreibzugriff für die anschließende Aktualisierung
      - name: Check-Out Mandanten-Branch
        if: steps.target.outputs.exists == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: mandant
          persist-credentials: true
          ref: ${{ matrix.branch }}
          repository: ${{ matrix.repository }}
          token: ${{ secrets.WORKFLOW_CONFIGURATION_TOKEN }}

      # Verhindert einen Push, wenn sich kein Workflow geändert hat
      - name: Bisherigen Commit speichern
        if: steps.target.outputs.exists == 'true'
        id: before
        run: printf 'sha=%s\n' "$(git -C mandant rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Aktualisiert und prüft die Workflow-Dateien
      - name: Workflow-Dateien aktualisieren
        if: steps.target.outputs.exists == 'true'
        env:
          ROLLOUT_SHA: ${{ needs.prepare.outputs.rollout_sha }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/workflow_configuration.py
          prepare-mandant
          --mandant-root mandant
          --rollout-sha "$ROLLOUT_SHA"

      # Pusht geänderte Workflow-Dateien ohne Force-Push
      - name: Mandanten-Branch aktualisieren
        if: steps.target.outputs.exists == 'true'
        env:
          MANDANT_BRANCH: ${{ matrix.branch }}
          TARGET_SHA: ${{ steps.before.outputs.sha }}
        run: |
          updated_sha="$(git -C mandant rev-parse HEAD)"
          if [[ "$updated_sha" == "$TARGET_SHA" ]]; then
            exit 0
          fi
          git -C mandant push origin "HEAD:refs/heads/$MANDANT_BRANCH"
