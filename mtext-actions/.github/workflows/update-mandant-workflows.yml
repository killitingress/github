name: Update mandant workflows

# Dieser manuell gestartete Batch aktualisiert die Workflowdateien aller
# vorgesehenen Mandantenbranches auf dieselbe freigegebene zentrale Version.
# Er führt keinen Code aus den Mandanten-Repositories aus.
'on':
  workflow_dispatch:
    inputs:
      automation_sha:
        description: Vollständige Commit-SHA der freigegebenen mtext-actions-Version
        required: true
        type: string

# Das normale GITHUB_TOKEN bleibt lesend. Schreibzugriffe verwenden nur das
# auf die vorgesehenen Repositories begrenzte technische Token des Environments.
permissions:
  contents: read

# Mandanten-Aktualisierungen werden serialisiert, damit zwei Läufe nicht
# gleichzeitig unterschiedliche zentrale Versionen verteilen.
concurrency:
  group: mandanten-aktualisierung
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare shared rollout
    # Diese vorab gesetzte Repositoryvariable löst das Bootstrap-Problem. Alle
    # übrigen zentralen Jobs erhalten durch diesen Lauf einen festen Runnerwert.
    runs-on: ${{ vars.FI_RUNNER_LABEL }}
    environment: Einrichtung
    timeout-minutes: 10
    outputs:
      rollout_sha: ${{ steps.rollout.outputs.rollout_sha }}
      update_matrix: ${{ steps.rollout.outputs.update_matrix }}
    # Alle technischen Commits erhalten eine feste, nicht personenbezogene Identität.
    env:
      GIT_AUTHOR_NAME: mtext-actions Aktualisierung
      GIT_AUTHOR_EMAIL: mtext-actions@users.noreply.github.com
      GIT_COMMITTER_NAME: mtext-actions Aktualisierung
      GIT_COMMITTER_EMAIL: mtext-actions@users.noreply.github.com
    steps:
      # Das technische Token darf den möglichen Bootstrap-Commit im zentralen
      # Repository und später die vorgesehenen Mandantenbranches schreiben.
      - name: Check out central automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: automation
          persist-credentials: true
          ref: ${{ inputs.automation_sha }}
          token: ${{ secrets.WORKFLOW_CONFIGURATION_TOKEN }}

      # Python und Git müssen bereits auf dem Runner der FI bereitgestellt sein.
      - name: Prepare approved Python runtime
        id: runtime
        run: automation/scripts/runner-preflight.sh

      # Der zentrale Stand wird zuerst vollständig geprüft. Falls das feste
      # Runner-Kennzeichen noch fehlt, entsteht vor dem Batch ein neuer Commit.
      - name: Prepare central rollout version
        env:
          AUTOMATION_SHA: ${{ inputs.automation_sha }}
          FI_RUNNER_LABEL: ${{ vars.FI_RUNNER_LABEL }}
          PYTHONPATH: automation/src
        run: >-
          "${{ steps.runtime.outputs.python }}" -m workflow_configuration
          prepare-automation
          --automation-root automation
          --runner-label "$FI_RUNNER_LABEL"
          --automation-sha "$AUTOMATION_SHA"

      # Ein Bootstrap-Commit muss erreichbar sein, bevor Mandanten-Commits auf
      # ihn verweisen. Ein bereits finalisierter Stand erzeugt keinen Push.
      - name: Push central rollout version
        env:
          AUTOMATION_SHA: ${{ inputs.automation_sha }}
        run: |
          if [[ "$(git -C automation rev-parse HEAD)" != "$AUTOMATION_SHA" ]]; then
            git -C automation push origin HEAD:refs/heads/main
          fi

      # Repositorynamen stammen aus der verbindlichen Mandantenzuordnung.
      # Die aktiven Releaselinien werden mit allen drei Branchstufen kombiniert.
      - name: Build update matrix
        id: rollout
        env:
          PYTHONPATH: automation/src
        run: |
          rollout_sha="$(git -C automation rev-parse HEAD)"
          update_matrix="$(
            "${{ steps.runtime.outputs.python }}" -m workflow_configuration \
              update-matrix \
              --mandanten automation/config/mandanten.json \
              --releaselinien automation/config/releaselinien.json
          )"
          printf 'rollout_sha=%s\n' "$rollout_sha" >> "$GITHUB_OUTPUT"
          printf 'update_matrix=%s\n' "$update_matrix" >> "$GITHUB_OUTPUT"

  update:
    name: Update ${{ matrix.kuerzel }} ${{ matrix.branch }}
    needs: prepare
    runs-on: ${{ vars.FI_RUNNER_LABEL }}
    environment: Einrichtung
    timeout-minutes: 10
    strategy:
      # Fehler eines Mandantenbranches verhindern nicht die Aktualisierung der
      # übrigen Matrixeinträge. Wiederholungen sind ohne zusätzliche Commits möglich.
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.prepare.outputs.update_matrix) }}
    env:
      GIT_AUTHOR_NAME: mtext-actions Aktualisierung
      GIT_AUTHOR_EMAIL: mtext-actions@users.noreply.github.com
      GIT_COMMITTER_NAME: mtext-actions Aktualisierung
      GIT_COMMITTER_EMAIL: mtext-actions@users.noreply.github.com
    steps:
      # Die Implementierung wird aus genau der zuvor vorbereiteten Rollout-SHA
      # geladen und benötigt in diesem Checkout keine Schreibberechtigung.
      - name: Check out central rollout version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          path: automation
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.rollout_sha }}

      # Der Mandantencheckout dient nur als Dateienbestand. Aus ihm wird in
      # diesem privilegierten Job kein Programmcode ausgeführt.
      - name: Check out mandant workflow files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: mandant
          persist-credentials: true
          ref: ${{ matrix.branch }}
          repository: ${{ matrix.repository }}
          token: ${{ secrets.WORKFLOW_CONFIGURATION_TOKEN }}

      - name: Prepare approved Python runtime
        id: runtime
        run: automation/scripts/runner-preflight.sh

      # Workflowaufruf und Python-Checkout werden gemeinsam aktualisiert. Die
      # Python-Logik committet ausschließlich Dateien unter .github/workflows.
      - name: Prepare and verify mandant update
        env:
          PYTHONPATH: automation/src
          ROLLOUT_SHA: ${{ needs.prepare.outputs.rollout_sha }}
        run: >-
          "${{ steps.runtime.outputs.python }}" -m workflow_configuration
          prepare-mandant
          --automation-root automation
          --mandant-root mandant
          --rollout-sha "$ROLLOUT_SHA"

      # Ein unveränderter Branch führt lediglich zu einem erfolgreichen
      # idempotenten Push ohne zusätzlichen Commit.
      - name: Push verified mandant update
        env:
          MANDANT_BRANCH: ${{ matrix.branch }}
        run: git -C mandant push origin "HEAD:refs/heads/$MANDANT_BRANCH"
