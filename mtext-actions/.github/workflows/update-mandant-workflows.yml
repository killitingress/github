name: Mandanten-Workflows aktualisieren

# Dieser Workflow aktualisiert main und bestehende Release-Branches auf die freigegebene CI/CD-Version
'on':
  workflow_dispatch:
    inputs:
      automation_sha:
        description: Vollständige Commit-SHA der freigegebenen CI/CD-Version
        required: true
        type: string

permissions:
  contents: read

# Verhindert parallele Aktualisierungen derselben Mandanten-Repositories
concurrency:
  group: mandanten-aktualisierung
  cancel-in-progress: false

jobs:
  prepare:
    name: Prüft Rollout und erstellt Matrix
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    outputs:
      rollout_sha: ${{ steps.rollout.outputs.rollout_sha }}
      update_matrix: ${{ steps.rollout.outputs.update_matrix }}
    steps:
      # Lädt die freigegebene CI/CD-Version in den Arbeitsbereich
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          path: automation
          persist-credentials: false
          ref: ${{ inputs.automation_sha }}

      # Prüft den Runner und stellt den Pfad zur Python-Laufzeit als Ausgabe bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: automation/scripts/runner-preflight.sh

      # Prüft die angegebene CI/CD-Version für den Rollout
      - name: Rollout-Version prüfen
        env:
          AUTOMATION_SHA: ${{ inputs.automation_sha }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/workflow_configuration.py
          verify-automation
          --automation-sha "$AUTOMATION_SHA"

      # Erstellt die Matrix aus main und den konfigurierten Release-Branches
      - name: Branch-Matrix erstellen
        id: rollout
        env:
          AUTOMATION_SHA: ${{ inputs.automation_sha }}
        run: |
          update_matrix="$(
            "${{ steps.runtime.outputs.python }}" automation/src/workflow_configuration.py update-matrix
          )"
          printf 'rollout_sha=%s\n' "$AUTOMATION_SHA" >> "$GITHUB_OUTPUT"
          printf 'update_matrix=%s\n' "$update_matrix" >> "$GITHUB_OUTPUT"

  update:
    name: Aktualisiert ${{ matrix.kuerzel }} ${{ matrix.branch }}
    needs: prepare
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    strategy:
      # Verarbeitet die Zielbranches unabhängig voneinander
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.prepare.outputs.update_matrix) }}
    env:
      GIT_AUTHOR_NAME: mtext_actions Aktualisierung
      GIT_AUTHOR_EMAIL: mtext_actions@users.noreply.github.com
      GIT_COMMITTER_NAME: mtext_actions Aktualisierung
      GIT_COMMITTER_EMAIL: mtext_actions@users.noreply.github.com
    steps:
      # Lädt die zentrale Rollout-Version in den Arbeitsbereich
      - name: Check-Out Rollout-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          path: automation
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.rollout_sha }}

      # Prüft den Runner und stellt den Pfad zur Python-Laufzeit als Ausgabe bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: automation/scripts/runner-preflight.sh

      # Prüft über die GitHub-API, ob der Zielbranch vorhanden ist
      - name: Zielbranch prüfen
        id: target
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          TARGET_REPOSITORY: ${{ matrix.repository }}
          TARGET_BRANCH: ${{ matrix.branch }}
          WORKFLOW_CONFIGURATION_TOKEN: ${{ secrets.WORKFLOW_CONFIGURATION_TOKEN }}
        run: |
          exists="$(
            "${{ steps.runtime.outputs.python }}" automation/src/workflow_configuration.py \
            check-target-branch \
            --api-url "$GITHUB_API_URL" \
            --repository "$TARGET_REPOSITORY" \
            --branch "$TARGET_BRANCH"
          )"
          printf 'exists=%s\n' "$exists" >> "$GITHUB_OUTPUT"

      # Lädt den geschützten Mandanten-Branch als Dateienbestand
      - name: Check-Out Mandanten-Branch
        if: steps.target.outputs.exists == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: mandant
          persist-credentials: true
          ref: ${{ matrix.branch }}
          repository: ${{ matrix.repository }}
          token: ${{ secrets.WORKFLOW_CONFIGURATION_TOKEN }}

      # Merkt den aktuellen Commit des Zielbranches
      - name: Ziel-Commit merken
        if: steps.target.outputs.exists == 'true'
        id: before
        run: printf 'sha=%s\n' "$(git -C mandant rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Aktualisiert und prüft die Workflow-Dateien des Mandanten
      - name: Mandantenaktualisierung vorbereiten
        if: steps.target.outputs.exists == 'true'
        env:
          ROLLOUT_SHA: ${{ needs.prepare.outputs.rollout_sha }}
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/workflow_configuration.py
          prepare-mandant
          --mandant-root mandant
          --rollout-sha "$ROLLOUT_SHA"

      # Überträgt die Aktualisierung ohne Force-Push auf den Zielbranch
      - name: Mandanten-Branch aktualisieren
        if: steps.target.outputs.exists == 'true'
        env:
          MANDANT_BRANCH: ${{ matrix.branch }}
          TARGET_SHA: ${{ steps.before.outputs.sha }}
        run: |
          updated_sha="$(git -C mandant rev-parse HEAD)"
          if [[ "$updated_sha" == "$TARGET_SHA" ]]; then
            exit 0
          fi
          git -C mandant push origin "HEAD:refs/heads/$MANDANT_BRANCH"
