name: Wiederverwendbarer Start eines zentralen Workflows

# Release und Release-Freigabe wechseln in das zentrale Repository. Dort liegen
# die technische Identität und die Zugangsdaten für ihre weiteren Schritte.
'on':
  workflow_call:
    inputs:
      target_repository:
        description: Repository mit dem zentralen Workflow
        required: true
        type: string
      workflow:
        description: Datei des zentral zu startenden Workflows
        required: true
        type: string
      workflow_inputs:
        description: JSON-Objekt mit den Eingaben des zentralen Workflows
        required: true
        type: string
      automation_ref:
        description: Festgelegte CI/CD-Version
        required: true
        type: string
    secrets:
      dispatch_token:
        description: Token zum Starten des zentralen Workflows
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    name: Zentralen Workflow starten
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      # GitHub startet den benannten Workflow im zentralen Repository über die API.
      - name: Zentralen Workflow starten
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          DISPATCH_TOKEN: ${{ secrets.dispatch_token }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          WORKFLOW: ${{ inputs.workflow }}
          WORKFLOW_INPUTS: ${{ inputs.workflow_inputs }}
          AUTOMATION_REF: ${{ inputs.automation_ref }}
        run: |
          request_body="$(python3 -c 'import json, os; print(json.dumps({"ref": "main", "inputs": json.loads(os.environ["WORKFLOW_INPUTS"]) | {"automation_ref": os.environ["AUTOMATION_REF"]}}))')"
          curl --fail --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$request_body" \
            "$GITHUB_API_URL/repos/$TARGET_REPOSITORY/actions/workflows/$WORKFLOW/dispatches"
