name: Wiederverwendbare Prüfung der Mandantenkonfiguration

# Dieser Workflow prüft die Mandantenkonfiguration
'on':
  workflow_call:
    inputs:
      commit_sha:
        description: Commit im Mandanten-Repository mit der zu prüfenden Konfiguration
        required: true
        type: string
      automation_ref:
        description: CI/CD-Version, aus der dieser Workflow geladen wurde
        required: true
        type: string
    secrets:
      automation_token:
        description: Token zum Laden der festgelegten CI/CD-Version
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Mandantenkonfiguration prüfen
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      # Lädt den zu prüfenden Commit in den Arbeitsbereich
      - name: Check-Out Mandanten-Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      # Lädt die Skripte für die Konfigurationsprüfung
      - name: Check-Out CI/CD-Version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ inputs.automation_ref }}
          path: automation
          persist-credentials: false
          token: ${{ secrets.automation_token }}

      # Prüft Git und Python und stellt den Python-Pfad bereit
      - name: Python-Runtime ermitteln
        id: runtime
        run: bash automation/scripts/runner-preflight.sh

      # Prüft Struktur und fachliche Zuordnungen der .github/config.json
      - name: Mandantenkonfiguration prüfen
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/validate_config.py
