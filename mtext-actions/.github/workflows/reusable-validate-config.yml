name: Reusable mandant configuration validation

# Dieser wiederverwendbare Workflow validiert die Mandantenkonfiguration eines
# exakten Commits gegen die zentralen Releaselinien, ohne Zielsysteme anzusprechen.
'on':
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      automation_ref:
        required: true
        type: string
    secrets:
      automation_token:
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate mandant configuration
    # Das Platzhalter-Label wird durch das offizielle runs-on-Kennzeichen des
    # von der FI bereitgestellten Runners ersetzt.
    runs-on: FI_RUNNER_LABEL_TO_BE_SET
    timeout-minutes: 20
    steps:
      # Lädt genau den zu prüfenden Mandanten-Commit in einen getrennten Pfad und
      # speichert dabei keine GitHub-Zugangsdaten in der Git-Konfiguration.
      - name: Check out mandant repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      # Lädt die freigegebene CI/CD-Version mit der Validierungslogik und ihrer
      # versionierten Releaselinien-Zuordnung.
      - name: Check out approved CI/CD version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
          ref: ${{ inputs.automation_ref }}
          path: automation
          persist-credentials: false
          token: ${{ secrets.automation_token }}

      # Prüft den von der FI bereitgestellten Runner und stellt den Pfad zur vorgegebenen
      # Python-Laufzeit als Ausgabe für die Validierung bereit.
      - name: Prepare approved Python runtime
        id: runtime
        run: automation/scripts/runner-preflight.sh

      # Prüft Struktur und fachliche Zuordnungen der .github/config.json für das
      # aufrufende Repository; dieser Schritt führt keine externe Übergabe aus.
      - name: Validate configuration without external access
        run: >-
          "${{ steps.runtime.outputs.python }}" automation/src/validate_config.py
