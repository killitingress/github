name: Synchronisierung

# Dieser Workflow synchronisiert den ausgewählten Branchstand eines
# Mandanten-Repositories mit M/Text.
'on':
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  sync:
    name: Ressourcen synchronisieren
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      # Checkout lädt den zum Push oder manuellen Start gehörenden Branchstand.
      - name: Check-Out Mandantenstand
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: mtext_actions laden
        id: automation
        uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions@main

      # Synchronisiert die Ressourcen mit M/Text.
      - name: Ressourcen synchronisieren
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          MTEXT_PREVIOUS_COMMIT: ${{ github.event.before || '' }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$ACTION_PATH/src/mtext.py" resources sync

      # Vorhandene M/Text-Ausgaben zehn Tage am Lauf bereitstellen.
      - name: M/Text-Ergebnis speichern
        if: steps.sync.outputs.ergebnis_path != ''
        uses: actions/upload-artifact@v3
        with:
          name: ${{ steps.sync.outputs.ergebnis_name }}
          path: ${{ steps.sync.outputs.ergebnis_path }}
          if-no-files-found: error
          retention-days: 10
