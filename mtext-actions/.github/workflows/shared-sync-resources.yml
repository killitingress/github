name: Synchronisierung

# Dieser Workflow synchronisiert den ausgewählten Branchcommit eines
# Mandanten-Repositories mit M/Text.
'on':
  workflow_call:
    inputs:
      zielumgebung:
        description: Branchstandard, Entwicklung, Funktionstest oder Beide
        type: string
        default: Branchstandard

permissions:
  # Erfolgreiche Zielstände werden als technische Git-Referenzen fortgeschrieben.
  contents: write

jobs:
  sync:
    name: Ressourcen synchronisieren
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      # Commit des Pushes, Squash Merges oder manuellen Starts laden.
      - name: Check-Out Mandantencommit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: mtext_actions laden
        id: automation
        uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions@main

      # Synchronisiert die Ressourcen mit M/Text.
      - name: Ressourcen synchronisieren
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTION_PATH: ${{ steps.automation.outputs.action_path }}
          MTEXT_ZIELUMGEBUNG: ${{ inputs.zielumgebung }}
          GITHUB_REF_NAME: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: >-
          "${{ steps.automation.outputs.python }}"
          "$ACTION_PATH/src/mtext.py" resources sync

      # Vorhandene M/Text-Ausgaben zehn Tage am Lauf bereitstellen.
      - name: M/Text-Ergebnis speichern
        if: steps.sync.outputs.ergebnis_path != ''
        uses: actions/upload-artifact@v3
        with:
          name: ${{ steps.sync.outputs.ergebnis_name }}
          path: ${{ steps.sync.outputs.ergebnis_path }}
          if-no-files-found: error
          retention-days: 10
