name: Lieferung vorbereiten

# Dieser Workflow bereitet den in GitHub ausgewählten Branchstand für eine
# Lieferung vor. Die vorbereitende Person gibt den vorgesehenen Liefer-Tag beim
# manuellen Start an. Repository, Branch, SHA und Person stammen aus dem
# auslösenden Mandantenlauf. Der Shared Workflow prüft den Stand und hält SHA
# und Lieferumfang für die spätere Bestätigung als Laufartefakt fest. Die
# Vorbereitung erstellt noch keinen Liefer-Tag und startet keine
# Mainframe-Übergabe.
'on':
  workflow_dispatch:
    inputs:
      liefer_tag:
        description: Liefer-Tag, zum Beispiel r261.108
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Startet den Shared Workflow für den ausgewählten Branchstand
  vorpruefen:
    name: Lieferung vorprüfen
    uses: FI-Actions/fi_lbs_entw_oms_mtext_actions/.github/workflows/shared-lieferung-check.yml@main
    with:
      liefer_tag: ${{ inputs.liefer_tag }}
