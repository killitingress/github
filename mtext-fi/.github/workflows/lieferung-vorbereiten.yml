name: Lieferung vorbereiten

# Der manuelle Start verwendet den in GitHub ausgewählten Branch. Die
# Vorprüfung hält SHA und Lieferumfang für die spätere Bestätigung fest.
'on':
  workflow_dispatch:
    inputs:
      lieferung_tag:
        description: Liefer-Tag, zum Beispiel r261.108
        required: true
        type: string

permissions:
  contents: read

jobs:
  vorpruefen:
    name: Lieferung vorprüfen
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/shared-lieferung-check.yml@main
    with:
      source_repository: ${{ github.repository }}
      source_branch: ${{ github.ref_name }}
      source_sha: ${{ github.sha }}
      lieferung_tag: ${{ inputs.lieferung_tag }}
      actor: ${{ github.actor }}
    secrets:
      automation_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}
