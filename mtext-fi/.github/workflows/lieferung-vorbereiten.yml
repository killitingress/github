name: Lieferung vorbereiten

# Dieser Workflow bereitet den in GitHub ausgewählten Branchcommit für eine
# Lieferung vor. Zuerst werden Mandantenkonfiguration und Ressourcen im FULL-
# oder DELTA-Umfang der Lieferung geprüft. Befunde erscheinen als Warnungen und
# unterbrechen die Vorbereitung nicht. Der Liefer-Tag wird aus dem ausgewählten
# Branch abgeleitet. Repository, Branch, SHA und Person stammen aus dem
# auslösenden Mandantenlauf. Der Shared Workflow prüft den Lieferstand und hält
# SHA als technische Git-Referenz fest. Das Issue zeigt den Lieferumfang und
# nimmt die spätere Freigabe entgegen. Die
# Vorbereitung erstellt noch keinen Liefer-Tag und startet keine Übergabe.
'on':
  workflow_dispatch:

# Führt Vorbereitung und Ausführung eines Mandanten nacheinander aus.
concurrency:
  group: lieferung-${{ github.repository }}
  cancel-in-progress: false

permissions:
  # Der vorbereitete Commit wird als technische Git-Referenz festgehalten.
  contents: write
  issues: write

jobs:
  # Prüft bei FULL den Branchcommit und bei DELTA die geänderten Ressourcen.
  ressourcen-pruefen:
    name: Prüfung
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/shared-check-resources.yml@test
    with:
      umfang: lieferung

  # Startet den Shared Workflow für den ausgewählten Branchcommit
  vorpruefen:
    name: Vorbereitung
    needs: ressourcen-pruefen
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/shared-lieferung-check.yml@test
