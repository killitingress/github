name: M/Text-Ressourcen synchronisieren

# Dieser Workflow synchronisiert die Ressourcen mit der zugehörigen M/Text-Stufe
'on':
  push:
    branches:
      - main
      - release/[0-9][0-9][0-9]
      - feature/[0-9][0-9][0-9]/**
    # Änderungen an Workflow-Dateien lösen keine Ressourcensynchronisierung aus
    paths-ignore:
      - .github/workflows/**
    # Ein manueller Start gleicht den angegebenen Commit vollständig ab
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Vollständige Commit-SHA auf dem ausgewählten Branch
        required: true
        type: string

permissions:
  contents: read

# Die Warteschlange behält bis zu 100 Synchronisierungen und führt sie
# nacheinander aus
concurrency:
  group: mtext-sync-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  # Der zentrale Workflow führt die Synchronisierung aus
  sync:
    name: Ressourcen mit M/Text synchronisieren
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/shared-sync-resources.yml@main
    with:
      commit_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
    secrets:
      automation_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}
