name: M/Text-Ressourcen synchronisieren

# Dieser Workflow synchronisiert Mandantenressourcen mit der zugehörigen M/Text-Stufe
'on':
  push:
    branches:
      - main
      - release/R[0-9][0-9][0-9]
      - feature/R[0-9][0-9][0-9]/**
    # Änderungen an Workflow-Dateien lösen keine Ressourcensynchronisierung aus
    paths-ignore:
      - .github/workflows/**
    # Ein manueller Start gleicht den angegebenen Commit vollständig ab
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Vollständige Commit-SHA auf dem ausgewählten Branch
        required: true
        type: string

permissions:
  contents: read

# Verhindert parallele Synchronisierungen desselben Mandanten-Repositories
concurrency:
  group: mtext-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Ruft die Ressourcensynchronisierung der freigegebenen CI/CD-Version auf
  sync:
    name: Ressourcen synchronisieren
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/reusable-sync-resources.yml@0000000000000000000000000000000000000000
    with:
      commit_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
      automation_ref: 0000000000000000000000000000000000000000
    secrets:
      automation_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}
