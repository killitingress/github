name: Ressourcen synchronisieren

# Feature-Pushes synchronisieren Entwicklung, zusammengeführte PRs Funktionstest.
# Manuelle Läufe gleichen die ausgewählten Zielumgebungen vollständig ab.
'on':
  push:
    branches:
      - feature/[0-9][0-9][0-9]/**
    paths-ignore:
      - .github/workflows/**
  pull_request:
    types: [closed]
    branches:
      - main
      - release/[0-9][0-9][0-9]
    paths-ignore:
      - .github/workflows/**
  workflow_dispatch:
    inputs:
      zielumgebung:
        description: Zielumgebung für den Vollabgleich
        type: choice
        default: Branchstandard
        options:
          - Branchstandard
          - Entwicklung
          - Funktionstest
          - Beide

# Die Gruppe umfasst Prüfung, Planung und Übertragung des gesamten Laufs.
# GHES hält einen wartenden Lauf. Weitere Starts können diesen ersetzen.
concurrency:
  group: mtext-synchronisierung
  cancel-in-progress: false

permissions:
  # Erfolgreiche Synchronisierungsstände werden als technische Git-Referenzen gespeichert.
  contents: write

jobs:
  # Verwendet denselben FULL- oder DELTA-Umfang wie die Synchronisierung.
  ressourcen-pruefen:
    name: Prüfung
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/shared-check-resources.yml@test
    with:
      umfang: synchronisierung
      zielumgebung: ${{ inputs.zielumgebung || 'Branchstandard' }}

  # Der Shared Workflow führt die Synchronisierung aus
  sync:
    name: Synchronisierung
    needs: ressourcen-pruefen
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/shared-sync-resources.yml@test
    with:
      zielumgebung: ${{ inputs.zielumgebung || 'Branchstandard' }}
