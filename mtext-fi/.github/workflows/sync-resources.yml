name: M/Text-Ressourcen synchronisieren

# Dieser Workflow startet die Ressourcensynchronisierung für Feature-, main- und
# Release-Branches. Der Shared Workflow verwendet den Branchstand des
# auslösenden Ereignisses. Ein manueller Start gleicht den in GitHub
# ausgewählten Branch vollständig ab. Verschiedene Branches dürfen
# ihre Aufträge parallel an den gewählten Transportweg übergeben.
'on':
  push:
    branches:
      - main
      - release/[0-9][0-9][0-9]
      - feature/[0-9][0-9][0-9]/**
  # Der manuelle Start verwendet die Branchwahl von GitHub.
  workflow_dispatch:

# Ein aktiver Lauf wird beendet, bevor der nächste Lauf desselben Branches
# beginnt. Neuere Pushes können wartende Läufe ersetzen, weil ihr DELTA alle
# Änderungen seit dem letzten erfolgreichen Lauf enthält.
concurrency:
  group: mtext-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Der Shared Workflow liest den letzten erfolgreichen Vergleichsstand.
  actions: read

jobs:
  # Der Shared Workflow führt die Synchronisierung aus
  sync:
    name: Ressourcen mit M/Text synchronisieren
    uses: FI_Actions/fi_lbs_entw_oms_mtext_actions/.github/workflows/shared-sync-resources.yml@main
