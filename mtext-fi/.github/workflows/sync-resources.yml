name: Sync M/Text resources

# Feature-Pushes versorgen Entwicklung. Merges auf geschützte Zielbranches
# erscheinen als Push auf main oder release/Rnnn und versorgen Abnahme.
'on':
  push:
    branches:
      - main
      - release/R[0-9][0-9][0-9]
      - feature/R[0-9][0-9][0-9]/**
  # Der manuelle Start gleicht den angegebenen Commit vollständig mit dem Ziel
  # ab, das sich aus dem in der Oberfläche ausgewählten Branch ergibt.
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Vollständige Commit-SHA auf dem ausgewählten Branch
        required: true
        type: string

permissions:
  contents: read

# Zwei Läufe desselben Mandanten-Repositories dürfen dessen Projektstand unter
# serverSync nicht gleichzeitig verändern. Projektverzeichnisse verschiedener
# Mandanten überschneiden sich nicht und benötigen keine gemeinsame Sperre.
concurrency:
  group: mtext-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Der zentrale Ablauf erkennt den Releasewechsel am geänderten Feld
  # `releaselinie` und versorgt diesen Stand vollständig in beiden Zielstufen.
  # Andere Pushes und manuelle Vollabgleiche verwenden die Branchzuordnung.
  sync:
    name: Ressourcen synchronisieren
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/reusable-sync-resources.yml@0000000000000000000000000000000000000000
    with:
      commit_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
      automation_ref: 0000000000000000000000000000000000000000
    secrets:
      automation_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}
