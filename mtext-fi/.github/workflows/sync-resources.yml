name: Sync M/Text resources

# Dieser Workflow verteilt Entwicklungs- oder Abnahme-Branches über die
# zentralen Workflows an den entsprechenden M/Text-Server.
'on':
  # Nur Änderungen auf den Branches für Entwicklung und Abnahme lösen automatisch eine Verteilung aus.
  push:
    branches:
      - R[0-9][0-9][0-9]/Entwicklung
      - R[0-9][0-9][0-9]/Abnahme
    # Eine reine Änderung der Mandantenkonfiguration wird separat validiert
    # und verteilt keine unveränderten Ressourcen.
    paths-ignore:
      - .github/config.json
  # Initiale Vollsynchronisationen und Wiederholungen verlangen einen Commit.
  # Der Branch wird beim manuellen Start über den GitHub-Branchwähler festgelegt.
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exakter Commit-SHA für initiale Vollsynchronisation oder Wiederholung
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mtext-sync-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Der zentrale Ablauf leitet die Zielstufe aus dem geprüften Branchnamen ab.
  sync:
    name: Sync resources
    uses: j520730/mtext-actions/.github/workflows/reusable-sync-resources.yml@0000000000000000000000000000000000000000
    with:
      # Workflow und Implementierung verwenden denselben mtext-actions-Commit.
      commit_sha: ${{ inputs.commit_sha || github.sha }}
      # Der Runner checkt diese Version nach automation/ aus
      automation_ref: 0000000000000000000000000000000000000000
