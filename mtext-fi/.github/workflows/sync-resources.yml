name: Sync M/Text resources

# Feature-Pushes versorgen Entwicklung. Merges auf geschützte Zielbranches
# erscheinen als Push auf main oder release/Rnnn und versorgen Abnahme.
'on':
  push:
    branches:
      - main
      - release/R[0-9][0-9][0-9]
      - feature/R[0-9][0-9][0-9]/**
    # Eine reine Konfigurationsänderung wird geprüft, überträgt aber keine
    # unveränderten Ressourcen. Der Linienwechsel besitzt einen eigenen FULL-Lauf.
    paths-ignore:
      - .github/config.json
  # Der manuelle Start dient der ersten Vollsynchronisation und der
  # Wiederherstellung. Der Branch wird über den GitHub-Branchwähler festgelegt.
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exakter Commit-SHA des wiederherzustellenden Stands
        required: true
        type: string
      full_sync:
        description: Vollständigen Projektstand wiederherstellen
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# Ein gemeinsamer Mandantenbereich unter serverSync darf nicht durch zwei
# gleichzeitige Läufe desselben Repositories verändert werden.
concurrency:
  group: mtext-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Die zentrale Automatisierung leitet Releaselinie und M/Text-Ziel aus dem
  # geprüften Branch und der Mandantenkonfiguration ab.
  sync:
    name: Sync resources
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/reusable-sync-resources.yml@0000000000000000000000000000000000000000
    with:
      commit_sha: ${{ inputs.commit_sha || github.sha }}
      automation_ref: 0000000000000000000000000000000000000000
      full_sync: ${{ inputs.full_sync || false }}
    secrets:
      automation_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}
