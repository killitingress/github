name: Mandantenkonfiguration und Ressourcen prüfen

# Bei Pull Requests prüft dieser Workflow Mandantenkonfiguration sowie die
# geänderten JSON- und XML-Ressourcen. Ein manueller Start prüft den ganzen Stand.
'on':
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Ein neuer Commit ersetzt die laufende Prüfung desselben Pull Requests
concurrency:
  group: resource-check-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Der zentrale Workflow führt Konfigurations- und Ressourcenprüfung aus.
  check:
    name: Mandantenkonfiguration und Ressourcen prüfen
    timeout-minutes: 15
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/reusable-check-resources.yml@0000000000000000000000000000000000000000
    with:
      # Pull Requests prüfen den Merge-Commit, manuelle Starts den gewählten Branchstand
      commit_sha: ${{ github.sha }}
      # Der Rollout trägt hier dieselbe CI/CD-Version wie in uses ein
      automation_ref: 0000000000000000000000000000000000000000
      changed_only: ${{ github.event_name == 'pull_request' }}
    secrets:
      automation_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}
