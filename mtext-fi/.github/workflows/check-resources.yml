name: Mandantenkonfiguration und Ressourcen prüfen

# Dieser Workflow prüft bei einem manuellen Start den ausgewählten Branchstand.
# Die Verarbeitung erfolgt im Shared Workflow aus der freigegebenen Version von
# mtext_actions.
'on':
  workflow_dispatch:

permissions:
  contents: read

# Ein neuer manueller Start ersetzt die laufende Prüfung desselben Branchs.
concurrency:
  group: resource-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Startet den Shared Workflow für den gewählten Mandantenstand
  check:
    name: Mandantenkonfiguration und Ressourcen prüfen
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/shared-check-resources.yml@main
