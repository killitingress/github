name: Ressourcen prüfen

# Dieser Workflow prüft bei einem manuellen Start den ausgewählten Branchcommit.
# Die Verarbeitung erfolgt im Shared Workflow aus dem Testbranch von
# mtext_actions.
'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Ein neuer manueller Start ersetzt die laufende Prüfung desselben Branchs.
concurrency:
  group: resource-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Startet den Shared Workflow für den gewählten Mandantencommit
  check:
    name: Prüfung
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/shared-check-resources.yml@test
