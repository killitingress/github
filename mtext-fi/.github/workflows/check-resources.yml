name: Mandantenkonfiguration und Ressourcen prüfen

# Dieser Workflow startet die zentrale Prüfung für den aktuellen
# Mandantenstand. Bei Pull Requests prüft er den Merge-Commit, die
# Mandantenkonfiguration und die geänderten JSON- und XML-Ressourcen. Bei einem
# manuellen Start verwendet er den ausgewählten Branchstand und erlaubt das
# Abwählen der Ressourcenprüfung. Die Verarbeitung erfolgt im Shared Workflow
# aus der freigegebenen Version von mtext_actions.
'on':
  pull_request:
  workflow_dispatch:
    inputs:
      check_resources:
        description: JSON- und XML-Ressourcen prüfen
        type: boolean
        default: true

permissions:
  contents: read

# Ein neuer Commit ersetzt die laufende Prüfung desselben Pull Requests
concurrency:
  group: resource-check-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Übergibt den gewählten Mandantenstand an die zentrale Prüfung
  check:
    name: Mandantenkonfiguration und Ressourcen prüfen
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/shared-check-resources.yml@main
    with:
      # Pull Requests prüfen den Merge-Commit, manuelle Starts den gewählten
      # Branchstand
      commit_sha: ${{ github.sha }}
      check_resources: ${{ github.event_name != 'workflow_dispatch' || inputs.check_resources }}
      changed_only: ${{ github.event_name == 'pull_request' }}
    secrets:
      automation_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}
