name: Start central release

# Ein geschützter Release-Tag startet den zentralen Lauf in mtext-actions. Das
# Mandanten-Repository erhält dabei keinen Mainframe-Zugang.
'on':
  push:
    tags:
      - v[0-9][0-9][0-9].[0-9][0-9][0-9]

permissions:
  contents: read

concurrency:
  group: release-dispatch-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Der gepinnte zentrale Workflow validiert das Tag-Ereignis und verwendet
  # das auf Actions: write in mtext-actions begrenzte Mandanten-Secret.
  dispatch:
    name: Start release in mtext-actions
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/reusable-release-dispatch.yml@0000000000000000000000000000000000000000
    with:
      source_repository: ${{ github.repository }}
      target_repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
      release_tag: ${{ github.ref_name }}
      trigger_sha: ${{ github.sha }}
      automation_ref: 0000000000000000000000000000000000000000
    secrets:
      dispatch_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}
