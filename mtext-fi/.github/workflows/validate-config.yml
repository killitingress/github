name: Mandantenkonfiguration prüfen

# Dieser Workflow prüft jede geänderte Mandantenkonfiguration
'on':
  # Änderungen an der Mandantenkonfiguration lösen die Prüfung aus
  push:
    branches:
      - '**'
    paths:
      - .github/config.json

permissions:
  contents: read

concurrency:
  group: config-validation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ruft die Konfigurationsprüfung der freigegebenen CI/CD-Version auf
  validate:
    name: Prüft Mandantenkonfiguration
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/reusable-validate-config.yml@0000000000000000000000000000000000000000
    with:
      # Der Rollout ersetzt beide Platzhalter durch die freigegebene Commit-SHA
      commit_sha: ${{ github.sha }}
      automation_ref: 0000000000000000000000000000000000000000
    secrets:
      automation_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}
