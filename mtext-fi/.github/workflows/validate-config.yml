name: Mandantenkonfiguration prüfen

# Änderungen an .github/config.json starten die Prüfung
'on':
  push:
    branches:
      - '**'
    paths:
      - .github/config.json

permissions:
  contents: read

# Ein neuer Commit ersetzt die laufende Prüfung desselben Branches
concurrency:
  group: config-validation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Der zentrale Workflow führt die Prüfung aus
  validate:
    name: Mandantenkonfiguration prüfen
    timeout-minutes: 15
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/reusable-validate-config.yml@0000000000000000000000000000000000000000
    with:
      commit_sha: ${{ github.sha }}
      # Der Rollout trägt hier dieselbe CI/CD-Version wie in uses ein
      automation_ref: 0000000000000000000000000000000000000000
    secrets:
      automation_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}
