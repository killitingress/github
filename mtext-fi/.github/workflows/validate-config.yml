name: Validate mandant configuration

# Dieser Workflow prüft jede geänderte Mandantenkonfiguration mit der zentralen
# Validierungslogik, ohne Daten an M/Text oder den Mainframe zu übertragen.
'on':
  # Der Check liefert bei jeder Änderung der Mandantenkonfiguration frühes Feedback.
  push:
    branches:
      - '**'
    paths:
      - .github/config.json

permissions:
  contents: read

concurrency:
  group: config-validation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dieser Aufruf lässt den exakten Commit durch den Validierungsworkflow der
  # freigegebenen CI/CD-Version prüfen.
  validate:
    name: Validate mandant configuration
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/reusable-validate-config.yml@0000000000000000000000000000000000000000
    with:
      # Der CI/CD-Rollout ersetzt beide technischen Platzhalter gemeinsam durch
      # die Commit-SHA der freigegebenen Version von mtext_actions.
      commit_sha: ${{ github.sha }}
      automation_ref: 0000000000000000000000000000000000000000
    secrets:
      automation_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}
