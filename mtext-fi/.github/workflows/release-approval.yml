name: Release freigeben und starten

# Der manuelle Start verwendet den in GitHub ausgewählten Lieferbranch und legt
# den Freigabe-Branch an. Den Pull Request dazu eröffnet der Antragsteller
# selbst. Ein Check zeigt den Lieferumfang, nach dem Merge entsteht der Tag.
# Der Tag startet den zentralen Release-Workflow.
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release aus dem Wartungstool, zum Beispiel v261.108
        required: true
        type: string
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
  push:
    tags:
      - v[0-9][0-9][0-9].[0-9][0-9][0-9]
      - v[0-9][0-9][0-9].[0-9][0-9][0-9][a-zA-Z]

permissions:
  contents: read

jobs:
  prepare:
    name: Release-Freigabe vorbereiten
    if: github.event_name == 'workflow_dispatch'
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/reusable-dispatch.yml@0000000000000000000000000000000000000000
    with:
      workflow: release-approval.yml
      workflow_inputs: >-
        {"phase":"prepare","source_repository":${{ toJSON(github.repository) }},"source_branch":${{ toJSON(github.ref_name) }},"source_sha":${{ toJSON(github.sha) }},"release_tag":${{ toJSON(inputs.release_tag) }}}
    secrets:
      dispatch_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}

  # Die Vorprüfung läuft als Job dieses Pull Requests, damit GitHub ihr
  # Ergebnis und die Markdown-Zusammenfassung direkt dort anzeigt. Bei anderen
  # Pull Requests wird der Job erfolgreich übersprungen.
  check:
    name: Release vorprüfen
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      startsWith(github.event.pull_request.head.ref, 'release-approval/')
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/reusable-release-approval-check.yml@0000000000000000000000000000000000000000
    with:
      source_repository: ${{ github.repository }}
      source_branch: ${{ github.event.pull_request.base.ref }}
      approval_branch: ${{ github.event.pull_request.head.ref }}
      target_sha: ${{ github.event.pull_request.head.sha }}
      # Der Rollout trägt hier dieselbe CI/CD-Version wie in uses ein
      automation_ref: 0000000000000000000000000000000000000000
    secrets:
      automation_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}

  finalize:
    name: Freigegebenen Release-Tag erstellen
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release-approval/')
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/reusable-dispatch.yml@0000000000000000000000000000000000000000
    with:
      workflow: release-approval.yml
      workflow_inputs: >-
        {"phase":"finalize","source_repository":${{ toJSON(github.repository) }},"source_branch":${{ toJSON(github.event.pull_request.base.ref) }},"approval_branch":${{ toJSON(github.event.pull_request.head.ref) }},"merge_sha":${{ toJSON(github.event.pull_request.merge_commit_sha) }},"pull_request_number":${{ toJSON(format('{0}', github.event.pull_request.number)) }}}
    secrets:
      dispatch_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}

  # Der Tag ist das verbindliche Startsignal für reguläre und Beta-Releases.
  # Dadurch bleibt der Releasebau vom Abschluss der Freigabe getrennt.
  release:
    name: Zentrales Release starten
    if: github.event_name == 'push'
    concurrency:
      group: release-dispatch-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/reusable-dispatch.yml@0000000000000000000000000000000000000000
    with:
      workflow: release.yml
      workflow_inputs: >-
        {"source_repository":${{ toJSON(github.repository) }},"release_tag":${{ toJSON(github.ref_name) }},"trigger_sha":${{ toJSON(github.sha) }}}
    secrets:
      dispatch_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}
