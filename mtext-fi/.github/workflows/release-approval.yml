name: Release vorbereiten

# Der manuelle Start verwendet den in GitHub ausgewählten Lieferbranch und legt
# den Freigabe-Branch an. Den Pull Request dazu eröffnet der Antragsteller
# selbst. Nach dessen Merge wird der Release-Tag erstellt.
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release aus dem Wartungstool, zum Beispiel v261.108
        required: true
        type: string
  pull_request:
    types:
      - closed
    paths:
      - .github/release-approvals/*.json

permissions:
  contents: read

jobs:
  prepare:
    name: Release-Freigabe vorbereiten
    if: github.event_name == 'workflow_dispatch'
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/reusable-dispatch.yml@0000000000000000000000000000000000000000
    with:
      target_repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
      workflow: release-approval-prepare.yml
      workflow_inputs: >-
        {"source_repository":${{ toJSON(github.repository) }},"source_branch":${{ toJSON(github.ref_name) }},"source_sha":${{ toJSON(github.sha) }},"release_tag":${{ toJSON(inputs.release_tag) }}}
      # Der Rollout trägt hier dieselbe CI/CD-Version wie in uses ein
      automation_ref: 0000000000000000000000000000000000000000
    secrets:
      dispatch_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}

  finalize:
    name: Freigegebenen Release-Tag erstellen
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release-approval/')
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/reusable-dispatch.yml@0000000000000000000000000000000000000000
    with:
      target_repository: FinanzInformatik/fi_lbs_entw_oms_mtext_actions
      workflow: release-approval-finalize.yml
      workflow_inputs: >-
        {"source_repository":${{ toJSON(github.repository) }},"source_branch":${{ toJSON(github.event.pull_request.base.ref) }},"approval_branch":${{ toJSON(github.event.pull_request.head.ref) }},"merge_sha":${{ toJSON(github.event.pull_request.merge_commit_sha) }},"pull_request_number":${{ toJSON(format('{0}', github.event.pull_request.number)) }}}
      # Der Rollout trägt hier dieselbe CI/CD-Version wie in uses ein
      automation_ref: 0000000000000000000000000000000000000000
    secrets:
      dispatch_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}
