name: Lieferung ausführen

# Ein geplanter Liefer-Tag wird aus seiner neuesten Vorbereitung ausgeführt.
# Ein vorhandener Liefer-Tag wird erneut an den Mainframe übergeben.
'on':
  workflow_dispatch:
    inputs:
      lieferung_tag:
        description: Geplanter oder vorhandener Liefer-Tag, zum Beispiel r261.108
        required: true
        type: string
      direktlieferung_bestaetigt:
        description: Direktlieferung, Abweichung vom Vier-Augenprinzip und Risiko bewusst bestätigen
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  lieferung-ausfuehren:
    name: Lieferung ausführen
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/shared-lieferung-ausfuehren.yml@main
    with:
      source_repository: ${{ github.repository }}
      lieferung_tag: ${{ inputs.lieferung_tag }}
      actor: ${{ github.actor }}
      direktlieferung_bestaetigt: ${{ inputs.direktlieferung_bestaetigt }}
    secrets:
      automation_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}
      dispatch_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}
