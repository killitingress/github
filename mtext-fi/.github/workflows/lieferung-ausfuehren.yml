name: Lieferung ausführen

# Eine vorbereitete Lieferung beginnt mit `/freigabe` im Freigabe-Issue.
# `/wiederholung` führt eine bereits getaggte Lieferung aus demselben Issue
# erneut aus. Der Tag wird aus dem Issue gelesen und mit seiner Annotation geprüft.
# Für eine Korrektur ist der Liefer-Tag zu löschen, der Bereitstellungs-Branch zu
# korrigieren und dann eine erneute Vorbereitung durchzuführen.
'on':
  issue_comment:
    types: [created]

# Lieferungen desselben Mandanten nacheinander ausführen. Nach erfolgreichem
# Abschluss das zugehörige Issue schließen.
concurrency:
  group: lieferung-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Freigaben und Wiederholungen verwenden den freigegebenen Stand von main.
  lieferung-ausfuehren:
    name: Lieferung
    if: >-
      github.event.issue.pull_request == null &&
      (
        (contains(github.event.issue.labels.*.name, 'lieferung:vorbereitet') &&
         github.event.comment.body == '/freigabe') ||
        ((contains(github.event.issue.labels.*.name, 'lieferung:gestartet') ||
          contains(github.event.issue.labels.*.name, 'lieferung:abgeschlossen')) &&
         github.event.comment.body == '/wiederholung')
      )
    permissions:
      contents: write
      actions: read
      issues: write
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/shared-lieferung-ausfuehren.yml@main
    with:
      freigabe_issue: ${{ github.event.issue.number }}
    secrets:
      ize9_ftps_password_mtext: ${{ secrets.IZE9_FTPS_PASSWORD_MTEXT }}

  # Eine doppelte Freigabe wird abgelehnt und erhält einen Bot-Kommentar
  freigabe-hinweis:
    name: Freigabe melden
    if: >-
      github.event.issue.pull_request == null &&
      (contains(github.event.issue.labels.*.name, 'lieferung:gestartet') ||
      contains(github.event.issue.labels.*.name, 'lieferung:abgeschlossen')) &&
      github.event.comment.body == '/freigabe'
    permissions:
      issues: write
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Hinweis im Issue ergänzen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FREIGABE_ISSUE: ${{ github.event.issue.number }}
        run: |
          # bei verbrauchter Freigabe den Weg zum neuen Lauf direkt im Issue erklären
          curl --fail --silent --show-error --output /dev/null \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"body":"Für dieses Issue wurde bereits eine Freigabe durchgeführt. Für einen neuen Lauf unter Actions `Lieferung vorbereiten` starten und das neue Freigabe-Issue prüfen. Bei einer Korrektur den vorhandenen Liefer-Tag zuvor manuell löschen."}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$FREIGABE_ISSUE/comments"
