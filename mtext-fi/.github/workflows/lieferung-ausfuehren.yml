name: Lieferung ausführen

# Dieser Workflow startet eine Lieferung mit einem geplanten oder vorhandenen
# Liefer-Tag. Ein geplanter Tag wird aus seiner neuesten Vorbereitung ausgeführt
# und mit der ausführenden Person geprüft. Für eine Direktlieferung muss die
# Abweichung vom 4-Augenfall bewusst bestätigt werden. Ein vorhandener
# Liefer-Tag wird als Wiederholung erneut verarbeitet. Bei einer erstmaligen
# Lieferung erstellt der wiederverwendbare Workflow den Liefer-Tag. Paketbau,
# Mainframe-Übergabe und Bereitstellungsbericht bleiben Teil dieses Laufs.
'on':
  workflow_dispatch:
    inputs:
      liefer_tag:
        description: Geplanter oder vorhandener Liefer-Tag, zum Beispiel r261.108
        required: true
        type: string
      direktlieferung_bestaetigt:
        description: Direktlieferung, Abweichung vom 4-Augenfall und Risiko bewusst bestätigen
        required: false
        type: boolean
        default: false

jobs:
  # Startet den Shared Workflow für den gewählten Liefer-Tag
  lieferung-ausfuehren:
    name: Lieferung ausführen
    permissions:
      contents: write
      actions: read
    uses: FI-Actions/fi_lbs_entw_oms_mtext_actions/.github/workflows/shared-lieferung-ausfuehren.yml@main
    with:
      liefer_tag: ${{ inputs.liefer_tag }}
      direktlieferung_bestaetigt: ${{ inputs.direktlieferung_bestaetigt }}
    secrets:
      mainframe_ftps_password: ${{ secrets.MAINFRAME_FTPS_PASSWORD }}
