name: Lieferung ausführen

# Dieser Workflow startet eine Lieferung mit einem geplanten oder vorhandenen
# Liefer-Tag. Ein geplanter Tag wird aus seiner neuesten Vorbereitung ausgeführt
# und mit der ausführenden Person geprüft. Für eine Direktlieferung muss die
# Abweichung vom Vier-Augenprinzip bewusst bestätigt werden. Ein vorhandener
# Liefer-Tag wird als Wiederholung erneut verarbeitet. Bei einer erstmaligen
# Lieferung erstellt mtext_actions den Liefer-Tag. Paketbau, Mainframe-Übergabe
# und Bereitstellungsbericht laufen ebenfalls zentral.
'on':
  workflow_dispatch:
    inputs:
      liefer_tag:
        description: Geplanter oder vorhandener Liefer-Tag, zum Beispiel r261.108
        required: true
        type: string
      direktlieferung_bestaetigt:
        description: Direktlieferung, Abweichung vom Vier-Augenprinzip und Risiko bewusst bestätigen
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  # Startet den zentralen Lieferablauf für den gewählten Liefer-Tag
  lieferung-ausfuehren:
    name: Lieferung ausführen
    uses: FinanzInformatik/fi_lbs_entw_oms_mtext_actions/.github/workflows/shared-lieferung-ausfuehren.yml@main
    with:
      liefer_tag: ${{ inputs.liefer_tag }}
      direktlieferung_bestaetigt: ${{ inputs.direktlieferung_bestaetigt }}
    secrets:
      automation_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}
      dispatch_token: ${{ secrets.MTEXT_ACTIONS_TOKEN }}
